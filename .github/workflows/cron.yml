# Scheduled jobs for The Sunday Chronicle.
#
# These used to live in tsc/vercel.json. They never ran: the Vercel account is
# on Hobby, which allows 2 cron jobs and fires them once a day at an
# approximate time, and vercel.json declared 5. Nothing scheduled had ever
# executed, so every sync in the database was somebody pressing a button.
#
# GitHub Actions runs them instead. It is free on public repos, honours the
# exact schedule, and needs no Vercel plan change. The Vercel `crons` block
# has been removed so these are the only driver and nothing double-fires.
#
# THIS FILE IS NOW THE ONLY SCHEDULER. tsc/vercel.json no longer records any
# of it: Vercel's config schema rejects unknown keys, so the explanation
# could not live there as a comment. If you later move to Vercel Pro and
# want the crons back in vercel.json, delete this workflow in the same
# commit or every job fires twice.
#
# ── ORDER IS THE POINT ────────────────────────────────────────────────────
# The trade pipeline is a dependency chain, and it used to be scheduled as
# five unrelated jobs at five unrelated times. That produced two silent bugs:
#
#   1. Player values refreshed WEEKLY (Mondays) while the Sleeper dictionary
#      under them refreshed daily. Injury designations on the player lines
#      the grader writes from were therefore up to seven days stale. A back
#      injury on Wednesday still read as healthy in a Sunday grade.
#   2. Trades only entered the database through the weekly Tuesday refresh,
#      so a Wednesday trade was graded eight days later.
#
# Both are fixed by running the chain in order, in one job, every day:
#
#      sleeper players  →  player values  →  draft ranks
#                                 ↓
#                          trades sweep  →  grading
#
# A step that fails ABORTS the rest of the chain. That is deliberate: every
# downstream step reads what an upstream step wrote, and grading in
# particular writes a permanent, public, human-readable verdict. A grade
# written against stale ranks looks perfectly fine and is wrong forever, so
# skipping a day is the cheap outcome. Everything here is idempotent and
# backlog-draining, so the next run picks up whatever was missed.
#
# grade-trades independently refuses to run if player_values is more than 26
# hours old (HTTP 503). The ordering below is the mechanism; that guard is
# the seatbelt for hand-dispatched runs.
#
# Note that the ordering only governs the player_values TABLE (ranks, injury
# designation, age). The market values themselves are not scheduled at all:
# grading pulls those live every run, bypassing the 6h browse cache, because
# a trade made on Wednesday's news must not be priced off Tuesday's market.
# So the evening sweep below is just as accurate on market values as the
# morning chain, even though it does not refresh the table first.
#
# Setup (one time):
#   1. Repo Settings > Secrets and variables > Actions > New repository secret
#        CRON_SECRET   the same value set in Vercel's env vars
#   2. Optional variable, if the domain ever changes:
#        SITE_URL      defaults to https://thesundaychronicle.app
#
# Each endpoint checks `Authorization: Bearer $CRON_SECRET` and fails closed,
# so a missing secret shows up as 401 rather than an open endpoint.
#
# Times are UTC. GitHub may delay a run when the platform is busy, which is
# fine for all of these: every one is idempotent and simply picks up whatever
# is still outstanding on its next pass.

name: Scheduled jobs

on:
  schedule:
    # Daily chain, 09:00 UTC (~5am ET). Everything the trade pipeline needs,
    # in dependency order, finishing with grading.
    - cron: '0 9 * * *'
    # Evening trade sweep, 23:00 UTC (~7pm ET). Values are already fresh from
    # the morning chain, so this only picks up trades made during the day and
    # grades them, halving worst-case latency from a full day to about twelve
    # hours. In-season this is the pass that makes the wire feel live.
    - cron: '0 23 * * *'
    # Weekly full live re-ingest, Tuesday 12:00 UTC (~8am ET). This is the
    # heavy one: every week's matchups, lineups and drafts for every live
    # source. Too expensive to run daily, which is exactly why the trades
    # stage was split out into its own sweep.
    #
    # Tuesday morning, not Tuesday evening: the week's scores are final once
    # Monday Night Football ends, and waiting until 22:00 UTC (6pm ET) meant
    # the archive sat a day behind the league all through Tuesday. GitHub
    # routinely starts these runs several hours late, so 8am ET is also the
    # only start that reliably still lands on Tuesday.
    - cron: '0 12 * * 2'
    # The same Tuesday run then sends the weekly recaps, straight after the
    # refresh (see the case arm below), because a recap needs Monday night's
    # final scores in the database first. This Wednesday pass is the retry:
    # a league whose platform hadn't finalised on Tuesday is stored as 'held'
    # and goes out here instead. Already-sent recaps are skipped, so a run
    # that has nothing left to do sends nothing.
    - cron: '0 15 * * 3'
    # Social, Saturday 13:00 UTC (~9am ET): plan next week's X and Threads
    # posts and email the list for vetoes. Must stay on a Friday or Saturday:
    # the Drop Regret post captures that week's drops when it is planned.
    - cron: '0 13 * * 6'
    # Social, hourly from 12:20 to 02:20 UTC (8:20am to 10:20pm ET in summer
    # time, 7:20am to 9:20pm in winter): send whatever is due. Posts are
    # slotted on the hour between 8am and 8pm ET, so each lands at about :20
    # past and later runs catch up if GitHub starts late. The evening hours
    # past midnight UTC are for the 7pm and 8pm ET posts. Sends nothing until
    # SOCIAL_LIVE=1 in Vercel.
    - cron: '20 0-2,12-23 * * *'
  # Lets you run any single job by hand from the Actions tab, which is also
  # how you smoke-test that CRON_SECRET is correct without waiting a day.
  workflow_dispatch:
    inputs:
      job:
        description: 'Which endpoint to run'
        required: true
        default: daily-chain
        type: choice
        options:
          - daily-chain
          - trade-sweep
          - refresh
          - refresh-player-values
          - refresh-sleeper-players
          - refresh-draft-ranks
          - sync-trades
          - grade-trades
          - recaps
          - social-plan
          - social-publish

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Pick endpoints for this trigger
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL: ${{ github.event.inputs.job }}
        run: |
          # Order within each list is the execution order. Do not reshuffle
          # these without reading the ORDER IS THE POINT note at the top.
          daily_chain='refresh-sleeper-players refresh-player-values refresh-draft-ranks sync-trades grade-trades'
          trade_sweep='sync-trades grade-trades'

          case "$SCHEDULE" in
            '0 9 * * *')   paths="$daily_chain" ;;
            '0 23 * * *')  paths="$trade_sweep" ;;
            '0 12 * * 2')  paths='refresh recaps' ;;
            '0 15 * * 3')  paths='recaps' ;;
            '0 13 * * 6')  paths='social-plan' ;;
            '20 0-2,12-23 * * *') paths='social-publish' ;;
            *)
              # Manual dispatch.
              case "$MANUAL" in
                daily-chain) paths="$daily_chain" ;;
                trade-sweep) paths="$trade_sweep" ;;
                *)           paths="$MANUAL" ;;
              esac
              ;;
          esac
          # A schedule with no matching case arm above falls through to the
          # manual branch, where $MANUAL is empty, so `paths` ends up empty,
          # the loop below runs zero times and the run finishes GREEN having
          # done absolutely nothing. That is the worst possible failure mode
          # for a job whose only symptom is stale data, and it is one typo
          # away any time a cron line is edited. Fail loudly instead.
          if [ -z "$paths" ]; then
            echo "::error::No endpoints resolved for schedule='$SCHEDULE' input='$MANUAL'. Every 'on.schedule' cron must have a matching case arm above, character for character."
            exit 1
          fi

          echo "paths=$paths" >> "$GITHUB_OUTPUT"
          echo "Running in order: $paths"

      - name: Call endpoints
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://thesundaychronicle.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

          # Tolerate a SITE_URL set with a trailing slash. Without this a
          # value like "https://example.com/" builds "...com//api/cron/x/",
          # and a double slash is a different path to the router: it misses
          # the route entirely and gets answered by something unrelated
          # rather than failing in any way that names the real problem.
          SITE_URL="${SITE_URL%/}"
          echo "Base URL: $SITE_URL"

          for p in ${{ steps.pick.outputs.paths }}; do
            echo "::group::$p"
            offset=""
            pass=0

            # An endpoint may not finish its work in one request. `refresh`
            # walks every live source in the system inside a 300s function,
            # and on 2026-09-15 it hit that cap and 504'd, killing the chain.
            # It now stops on its own time budget and answers 200 with
            # {"done": false, "nextOffset": N}; this loop calls it back from
            # N until it reports done. Endpoints that finish in one pass
            # simply never send nextOffset and break out immediately, so
            # nothing here is special-cased by path name.
            while : ; do
              pass=$((pass + 1))

              # The TRAILING SLASH is required, not cosmetic. next.config.ts
              # sets `trailingSlash: true`, which applies to API routes too, so
              # /api/cron/grade-trades answers 308 -> /api/cron/grade-trades/.
              # curl does not follow redirects by default, so the slashless
              # form fails the run with a redirect status and never reaches the
              # handler. -L is kept as a backstop in case that config changes
              # direction later; on a same-host redirect curl carries the
              # Authorization header through, so auth still works either way.
              url="$SITE_URL/api/cron/$p/"
              if [ -n "$offset" ]; then
                url="$url?offset=$offset"
              fi

              # These are long jobs (maxDuration 300 server-side); give curl
              # room and capture the body so a failure explains itself here.
              code=$(curl -sSL -o /tmp/out.json -w '%{http_code}' \
                          --max-time 600 \
                          -H "Authorization: Bearer $CRON_SECRET" \
                          "$url" || echo 000)
              echo "pass $pass: HTTP $code  $url"
              head -c 4000 /tmp/out.json || true
              echo

              if [ "$code" != "200" ]; then
                echo "::endgroup::"
                # Abort the chain rather than running later steps against
                # whatever half-state this one left behind.
                echo "::error::$p returned HTTP $code - aborting the rest of the chain"
                exit 1
              fi

              # Prints the number, or nothing at all when the endpoint is done
              # (nextOffset null/absent) or the body isn't JSON. Empty means
              # stop, so a garbled body ends the loop rather than spinning.
              # One line on purpose: this sits inside a YAML block scalar, and
              # a real multi-line heredoc here either breaks the YAML or
              # arrives at python with the block's indentation still attached.
              offset=$(python3 -c "import json,sys;d=json.load(sys.stdin);v=d.get('nextOffset');print(v if isinstance(v,int) else '')" < /tmp/out.json 2>/dev/null || true)

              if [ -z "$offset" ]; then
                break
              fi

              # Safety net. Every pass must consume at least one source, so a
              # correct implementation converges in a handful; 20 means the
              # cursor is not advancing and this would otherwise spin until
              # the job timeout with nothing to show for it.
              if [ "$pass" -ge 20 ]; then
                echo "::endgroup::"
                echo "::error::$p still reporting work after $pass passes (nextOffset=$offset); giving up."
                exit 1
              fi
            done

            echo "::endgroup::"
          done
