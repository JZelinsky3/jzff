<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TSC &middot; slide treatments</title>

<!-- ============================================================
     REVIEW SHEET, NOT A POST.

     Six ways to draw ONE slide. Every tile carries the same two
     chapters — the Standings and the Seasons, which is slide 03 —
     with the same figures on it, so the only thing changing between
     tiles is the design language. Pick one and it gets applied to
     the whole deck.

     Each tile is a real 1080x1350 board scaled to 0.59, so the type
     sizes, rules and margins are exactly what would render. Nothing
     is drawn smaller "for the review".

     THREE RULES THIS SHEET IS OBEYING

     1. Two chapters to a slide. An earlier sheet drew twelve single
        artifacts and forgot that the deck puts two pages on a board.
        Every tile here is a whole slide.

     2. Only what the page already holds. Standings has rank, name,
        record, points, titles. Seasons has year, champion, record,
        points. Nothing invented, no new features.

     3. Breadth where the page is broad, depth where it is deep.
        Standings is a table of everybody, so it shows five or six.
        A rivalry or a manager profile is one thing seen closely and
        would show one — the opposite of this pairing.

     COLOUR: the ground stays neutral or borrows from one of the two
     pages. Never two saturated complements against each other; the
     green table with the oxblood border read as Christmas.
     ============================================================ -->

<style>
:root { --serif:'DM Serif Display', Georgia, serif;
        --sans:'Helvetica Neue', -apple-system, Arial, sans-serif;
        --mono:'SF Mono', Menlo, Monaco, Consolas, monospace; }
* { box-sizing:border-box; margin:0; padding:0; }
body { width:1440px; background:#0a0d12; color:#f4ebd8;
       font-family:var(--sans); -webkit-font-smoothing:antialiased; }
.sheet { padding:46px 50px 54px; }

.masthead { display:flex; align-items:flex-end; gap:22px;
  padding-bottom:18px; border-bottom:2px solid #26313f; }
.masthead h1 { font-family:var(--serif); font-weight:400; font-size:46px;
  line-height:1; }
.masthead h1 em { font-style:italic; color:#e8c889; }
.masthead p { margin-left:auto; max-width:680px; font-size:14px; line-height:1.5;
  color:#939ca8; text-align:right; }

.grid { margin-top:26px; display:grid; grid-template-columns:repeat(2,1fr);
  gap:30px 24px; }
.tile .frame { width:646px; height:808px; overflow:hidden; border-radius:3px;
  box-shadow:0 0 0 1px #26313f, 0 10px 26px rgba(0,0,0,.55); }
.tile .frame > .s { width:1080px; height:1350px; transform:scale(.5981);
  transform-origin:0 0; position:relative; overflow:hidden; }
.cap { padding:14px 4px 0; display:flex; gap:14px; align-items:flex-start; }
.cap .no { font-family:var(--mono); font-size:12px; letter-spacing:.2em;
  color:#6d7a89; padding-top:6px; }
.cap h3 { font-family:var(--serif); font-weight:400; font-size:25px; line-height:1; }
.cap p { margin-top:7px; font-size:14px; line-height:1.45; color:#939ca8;
  max-width:540px; }

/* ══════════════════════════════════════════════════════════════
   SHARED PIECES — the two figures, identical across all six, so
   only the container is being compared.
   ══════════════════════════════════════════════════════════════ */
.s { font-family:var(--sans); }
.s .kick { font-family:var(--mono); font-size:13px; letter-spacing:.24em;
  text-transform:uppercase; }
.s h2 { font-family:var(--serif); font-weight:400; font-size:54px; line-height:1;
  letter-spacing:-.01em; }
.s h2 em { font-style:italic; }
.s .dek { font-size:19px; line-height:1.45; }

.tbl { width:100%; }
.tbl .hr { display:flex; align-items:baseline; gap:26px; padding-bottom:9px;
  font-family:var(--mono); font-size:11px; letter-spacing:.22em;
  text-transform:uppercase; }
.tbl .rw { display:flex; align-items:center; gap:26px; padding:13px 0; }
.tbl .rk { width:26px; font-family:var(--mono); font-size:15px; }
.tbl .nm { flex:1; font-family:var(--serif); font-size:27px; line-height:1; }
.tbl .c  { font-family:var(--mono); font-size:16px; text-align:right; }
.tbl .w1 { width:84px; } .tbl .w2 { width:104px; } .tbl .w3 { width:52px; }

.yrs { display:flex; align-items:stretch; }
.yrs .y { flex:1; min-width:0; overflow:hidden; padding:0 10px;
  display:flex; flex-direction:column; justify-content:flex-end; }
.yrs .y .who { font-family:var(--serif); font-size:22px; line-height:1; }
.yrs .y .rec { margin-top:6px; font-family:var(--mono); font-size:12px; }
.yrs .y .bar { margin-top:10px; width:100%; }
.yrs .y .yr { margin-top:10px; padding-top:8px; font-family:var(--mono);
  font-size:13px; }

/* ── A. BROADSHEET ───────────────────────────────────────────── */
.cA { background:#e9ddc1; color:#241c0e; }
.cA .pg { position:absolute; inset:74px 78px; display:flex; flex-direction:column; }
.cA .mast { display:flex; justify-content:space-between; padding-bottom:12px;
  border-bottom:3px double #241c0e; font-family:var(--mono); font-size:13px;
  letter-spacing:.2em; text-transform:uppercase; color:#6d5f3e; }
.cA h2 { margin-top:26px; } .cA h2 em { color:#7a5c14; }
.cA .dek { margin-top:12px; color:#55482e; max-width:620px; }
.cA .tbl { margin-top:22px; }
.cA .tbl .hr { color:#8a7c5c; border-bottom:1px solid rgba(40,30,12,.45); }
.cA .tbl .rw { border-bottom:1px solid rgba(40,30,12,.22); }
.cA .tbl .rk, .cA .tbl .c { color:#55482e; }
.cA .cut { margin:28px 0 24px; height:7px;
  border-top:3px solid #3a1d16; border-bottom:1px solid #3a1d16; }
.cA .low { flex:1; min-height:0; display:flex; flex-direction:column; }
.cA .low h2 { margin-top:0; color:#3a1d16; } .cA .low h2 em { color:#8c2b1e; }
.cA .yrs { flex:1; min-height:0; margin-top:18px; }
.cA .yrs .y { border-left:1px solid rgba(40,30,12,.2); }
.cA .yrs .y:first-child { border-left:0; padding-left:0; }
.cA .yrs .y .rec { color:#7f7154; }
.cA .yrs .y .bar { background:#c3b28c; }
.cA .yrs .y.rep .bar { background:#3a1d16; }
.cA .yrs .y .yr { border-top:1px solid rgba(40,30,12,.3); color:#7f7154; }

/* ── B. PLATES ───────────────────────────────────────────────── */
.cB { background:#0c1016; }
.cB .pg { position:absolute; inset:74px 78px; display:flex; flex-direction:column;
  gap:26px; }
.cB .pl { flex:1; min-height:0; position:relative; padding:34px 38px;
  display:flex; flex-direction:column;
  box-shadow:0 16px 34px -12px rgba(0,0,0,.8); }
.cB .pl::after { content:''; position:absolute; inset:11px; pointer-events:none;
  border:1px solid currentColor; opacity:.22; }
.cB .one { background:#e9ddc1; color:#241c0e; }
.cB .two { background:#3a1d16; color:#e8c889; }
.cB .hd { display:flex; align-items:flex-end; gap:22px; margin-top:12px; }
.cB .hd h2 { flex:none; } .cB .hd .dek { flex:1; padding-bottom:6px; opacity:.74; }
.cB .one .kick { color:#8a7c5c; } .cB .two .kick { color:#c89a72; }
.cB .one h2 em { color:#7a5c14; }
.cB .two h2 { color:#f4ebd8; } .cB .two h2 em { color:#e8c889; }
.cB .tbl { margin-top:18px; }
.cB .one .tbl .hr { color:#8a7c5c; border-bottom:1px solid rgba(40,30,12,.4); }
.cB .one .tbl .rw { border-bottom:1px solid rgba(40,30,12,.2); padding:11px 0; }
.cB .one .tbl .rk, .cB .one .tbl .c { color:#55482e; }
.cB .yrs { flex:1; min-height:0; margin-top:18px; }
.cB .two .yrs .y { border-left:1px solid rgba(232,200,137,.16); }
.cB .two .yrs .y:first-child { border-left:0; padding-left:0; }
.cB .two .yrs .y .who { color:#f4ebd8; } .cB .two .yrs .y .rec { color:#c0a184; }
.cB .two .yrs .y .bar { background:rgba(232,200,137,.20); }
.cB .two .yrs .y.rep .bar { background:#e8c889; }
.cB .two .yrs .y .yr { border-top:1px solid rgba(232,200,137,.22); color:#c0a184; }

/* ── C. LAID PAPER ───────────────────────────────────────────── */
.cC { background:
    radial-gradient(ellipse 70% 46% at 50% 34%, rgba(232,200,137,.09), transparent 72%),
    linear-gradient(180deg,#14181e 0%,#0a0d11 100%); }
.cC .sh { position:absolute; left:70px; right:70px; background:#efe5cd;
  color:#241c0e; box-shadow:0 18px 40px -10px rgba(0,0,0,.85); }
.cC .one { top:92px; height:590px; transform:rotate(-.8deg); }
.cC .two { top:668px; height:590px; transform:rotate(.6deg); z-index:2; }
.cC .band { display:flex; justify-content:space-between; align-items:center;
  padding:11px 30px; font-family:var(--mono); font-size:13px; letter-spacing:.22em;
  text-transform:uppercase; }
.cC .one .band { background:#1e2a38; color:#e8c889; }
.cC .two .band { background:#3a1d16; color:#e8c889; }
.cC .in { padding:22px 30px 24px; display:flex; flex-direction:column;
  height:calc(100% - 44px); }
.cC h2 { color:#241c0e; } .cC .one h2 em { color:#2f4a68; }
.cC .two h2 em { color:#8c2b1e; }
.cC .dek { margin-top:10px; color:#55482e; }
.cC .tbl { margin-top:14px; }
.cC .tbl .hr { color:#8a7c5c; border-bottom:1px solid rgba(40,30,12,.4); }
.cC .tbl .rw { border-bottom:1px solid rgba(40,30,12,.2); padding:10px 0; }
.cC .tbl .rk, .cC .tbl .c { color:#55482e; }
.cC .yrs { flex:1; min-height:0; margin-top:12px; }
.cC .yrs .y { border-left:1px solid rgba(40,30,12,.18); }
.cC .yrs .y:first-child { border-left:0; padding-left:0; }
.cC .yrs .y .rec { color:#7f7154; }
.cC .yrs .y .bar { background:#cdbc97; }
.cC .yrs .y.rep .bar { background:#3a1d16; }
.cC .yrs .y .yr { border-top:1px solid rgba(40,30,12,.28); color:#7f7154; }

/* ── D. SPLIT FIELD ──────────────────────────────────────────── */
.cD .half { position:absolute; left:0; right:0; height:50%;
  padding:72px 78px; display:flex; flex-direction:column; }
.cD .one { top:0; background:#e9ddc1; color:#241c0e; }
.cD .two { top:50%; background:#3a1d16; color:#f4ebd8;
  box-shadow:0 -2px 0 rgba(232,200,137,.45); }
.cD .one .kick { color:#8a7c5c; } .cD .two .kick { color:#c89a72; }
.cD h2 { margin-top:14px; } .cD .one h2 em { color:#7a5c14; }
.cD .two h2 em { color:#e8c889; }
.cD .tbl { margin-top:auto; }
.cD .tbl .hr { color:#8a7c5c; border-bottom:1px solid rgba(40,30,12,.4); }
.cD .tbl .rw { border-bottom:1px solid rgba(40,30,12,.2); padding:11px 0; }
.cD .tbl .rk, .cD .tbl .c { color:#55482e; }
.cD .yrs { flex:1; min-height:0; margin-top:20px; }
.cD .yrs .y { border-left:1px solid rgba(244,235,216,.16); }
.cD .yrs .y:first-child { border-left:0; padding-left:0; }
.cD .yrs .y .rec { color:#c0a184; }
.cD .yrs .y .bar { background:rgba(244,235,216,.2); }
.cD .yrs .y.rep .bar { background:#e8c889; }
.cD .yrs .y .yr { border-top:1px solid rgba(244,235,216,.22); color:#c0a184; }

/* ── E. PANEL AND RAIL ───────────────────────────────────────── */
.cE { background:#0b0f14; }
.cE .pg { position:absolute; inset:74px 78px; display:flex; flex-direction:column;
  gap:24px; }
.cE .pn { flex:1; min-height:0; display:flex; border:1px solid;
  box-shadow:0 14px 30px -12px rgba(0,0,0,.8); }
.cE .rail { flex:none; width:60px; display:flex; align-items:center;
  justify-content:center; }
.cE .rail b { writing-mode:vertical-rl; font-family:var(--mono); font-size:13px;
  letter-spacing:.34em; text-transform:uppercase; font-weight:400; }
.cE .bd { flex:1; min-width:0; padding:28px 32px 28px 28px; display:flex;
  flex-direction:column; }
.cE .one { background:#e9ddc1; color:#241c0e; border-color:#cbbb96; }
.cE .one .rail { background:#241c0e; color:#e8c889; }
.cE .two { background:#3a1d16; color:#f4ebd8; border-color:#4d2a20; }
.cE .two .rail { background:#241009; color:#e8c889; }
.cE .one h2 em { color:#7a5c14; } .cE .two h2 em { color:#e8c889; }
.cE .one .dek { color:#55482e; } .cE .two .dek { color:#c9b3a6; }
.cE .tbl { margin-top:16px; }
.cE .one .tbl .hr { color:#8a7c5c; border-bottom:1px solid rgba(40,30,12,.4); }
.cE .one .tbl .rw { border-bottom:1px solid rgba(40,30,12,.2); padding:11px 0; }
.cE .one .tbl .rk, .cE .one .tbl .c { color:#55482e; }
.cE .yrs { flex:1; min-height:0; margin-top:16px; }
.cE .two .yrs .y { border-left:1px solid rgba(244,235,216,.14); }
.cE .two .yrs .y:first-child { border-left:0; padding-left:0; }
.cE .two .yrs .y .rec { color:#b49a8c; }
.cE .two .yrs .y .bar { background:rgba(244,235,216,.18); }
.cE .two .yrs .y.rep .bar { background:#e8c889; }
.cE .two .yrs .y .yr { border-top:1px solid rgba(244,235,216,.2); color:#b49a8c; }

/* ── F. TABBED CARDS ─────────────────────────────────────────── */
.cF { background:linear-gradient(180deg,#15181d 0%,#0b0d11 100%); }
.cF .pg { position:absolute; inset:82px 78px 74px; display:flex;
  flex-direction:column; gap:34px; }
.cF .cd { flex:1; min-height:0; position:relative; padding:30px 34px;
  display:flex; flex-direction:column;
  box-shadow:0 14px 32px -12px rgba(0,0,0,.85); }
.cF .tab { position:absolute; top:-30px; height:30px; padding:0 22px;
  display:flex; align-items:center; border-radius:3px 3px 0 0;
  font-family:var(--mono); font-size:13px; letter-spacing:.22em;
  text-transform:uppercase; }
.cF .one { background:#e9ddc1; color:#241c0e; }
.cF .one .tab { left:0; background:#1e2a38; color:#e8c889; }
.cF .two { background:#3a1d16; color:#f4ebd8; }
.cF .two .tab { left:172px; background:#8c2b1e; color:#f4ebd8; }
.cF .one h2 em { color:#2f4a68; } .cF .two h2 em { color:#e8c889; }
.cF .dek { margin-top:11px; } .cF .one .dek { color:#55482e; }
.cF .two .dek { color:#c9b3a6; }
.cF .tbl { margin-top:14px; }
.cF .one .tbl .hr { color:#8a7c5c; border-bottom:1px solid rgba(40,30,12,.4); }
.cF .one .tbl .rw { border-bottom:1px solid rgba(40,30,12,.2); padding:11px 0; }
.cF .one .tbl .rk, .cF .one .tbl .c { color:#55482e; }
.cF .yrs { flex:1; min-height:0; margin-top:14px; }
.cF .two .yrs .y { border-left:1px solid rgba(244,235,216,.15); }
.cF .two .yrs .y:first-child { border-left:0; padding-left:0; }
.cF .two .yrs .y .rec { color:#c0a184; }
.cF .two .yrs .y .bar { background:rgba(244,235,216,.18); }
.cF .two .yrs .y.rep .bar { background:#e8c889; }
.cF .two .yrs .y .yr { border-top:1px solid rgba(244,235,216,.2); color:#c0a184; }
</style>
</head>
<body>
<div class="sheet">
  <div class="masthead">
    <h1>Slide <em>treatments.</em></h1>
    <p>One slide, six ways. Same two chapters, same figures, same type sizes as
       the real board &mdash; only the design language changes. Each tile is a
       true 1080&times;1350 at 0.6 scale. Review sheet, not for posting.</p>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script>
'use strict';

/* Only what the two pages already hold. Standings: rank, manager,
   record, points, titles. Seasons: year, champion, record, points. */
const ST = [[1,'Bryce','78&ndash;40','14,982.4',2],
            [2,'John', '74&ndash;44','15,204.1',1],
            [3,'Matt', '71&ndash;47','14,556.8',1],
            [4,'Drew', '66&ndash;52','14,201.3',1],
            [5,'Nate', '62&ndash;56','13,884.9',0],
            [6,'Tyler','58&ndash;60','13,540.2',0]];

const SE = [['19','Matt', '9&ndash;5',  1802.9, 0],
            ['20','Drew', '10&ndash;4', 1744.2, 0],
            ['21','Bryce','11&ndash;3', 1851.2, 1],
            ['22','John', '12&ndash;2', 1884.6, 0],
            ['23','Nate', '9&ndash;5',  1698.4, 0],
            ['24','Bryce','10&ndash;4', 1806.1, 1],
            ['25','Jack', '11&ndash;3', 1770.5, 0]];

const star = n => '&#9733;'.repeat(n);

/* How many managers the table shows. Standings is a broad page, so
   it shows five or six. A rivalry or a manager profile is one thing
   seen closely and would show one. */
const tbl = (rows) => `
  <div class="tbl">
    <div class="hr"><span class="rk"></span><span class="nm"></span>
      <span class="c w1">Record</span><span class="c w2">Points</span>
      <span class="c w3">Titles</span></div>
    ${ST.slice(0, rows).map(([r, n, rec, pf, t]) => `
      <div class="rw"><span class="rk">${r}</span><span class="nm">${n}</span>
        <span class="c w1">${rec}</span><span class="c w2">${pf}</span>
        <span class="c w3">${star(t)}</span></div>`).join('')}
  </div>`;

const yrs = (max) => {
  const LO = 1600, HI = 1900;
  return `<div class="yrs">${SE.map(([y, w, r, pf, rep]) => `
    <div class="y${rep ? ' rep' : ''}">
      <div class="who">${w}</div><div class="rec">${r}</div>
      <div class="bar" style="height:${Math.round(((pf - LO) / (HI - LO)) * max)}px"></div>
      <div class="yr">&rsquo;${y}</div>
    </div>`).join('')}</div>`;
};

const K1 = 'Chapter one', K2 = 'Chapter two';
const H1 = 'The <em>Standings.</em>', H2 = 'The <em>Seasons.</em>';
const D1 = 'Every win, loss and point ever scored.';
const D2 = 'A front page for every year, and what it took to win it.';

const CONCEPTS = [

['A', 'Broadsheet',
 'No objects at all. One sheet of newsprint with the two regions divided by a \
rule, which is what the site&rsquo;s own front page already is. The page colours \
survive as the stock and the accent.', `
  <div class="s cA"><div class="pg">
    <div class="mast"><span>The Almanac</span><span>Chapters one and two</span></div>
    <h2>${H1}</h2><div class="dek">${D1}</div>${tbl(6)}
    <div class="cut"></div>
    <div class="low"><h2>${H2}</h2><div class="dek">${D2}</div>${yrs(186)}</div>
  </div></div>`],

['B', 'Plates',
 'Two flat fields of the pages&rsquo; own colours on a neutral ground. No \
binding, no frame, no border &mdash; a hairline inset is the only edge. Lets the \
real palette do all of the work.', `
  <div class="s cB"><div class="pg">
    <div class="pl one"><div class="kick">${K1}</div>
      <div class="hd"><h2>${H1}</h2><div class="dek">${D1}</div></div>${tbl(5)}</div>
    <div class="pl two"><div class="kick">${K2}</div>
      <div class="hd"><h2>${H2}</h2><div class="dek">${D2}</div></div>${yrs(176)}</div>
  </div></div>`],

['C', 'Laid paper',
 'Both chapters printed on the same stock and dropped on a dark surface at an \
angle, overlapping. The page colour is the header band and the accent, not the \
whole field.', `
  <div class="s cC">
    <div class="sh one">
      <div class="band"><span>${K1}</span><span>All-time</span></div>
      <div class="in"><h2>${H1}</h2><div class="dek">${D1}</div>${tbl(5)}</div></div>
    <div class="sh two">
      <div class="band"><span>${K2}</span><span>Year by year</span></div>
      <div class="in"><h2>${H2}</h2><div class="dek">${D2}</div>${yrs(148)}</div></div>
  </div>`],

['D', 'Split field',
 'No ground, no container, no margin between them. Two full-bleed fields meeting \
on one line. The loudest of the six, and the one that survives being seen at \
thumbnail size.', `
  <div class="s cD">
    <div class="half one"><div class="kick">${K1}</div><h2>${H1}</h2>${tbl(5)}</div>
    <div class="half two"><div class="kick">${K2}</div><h2>${H2}</h2>${yrs(168)}</div>
  </div>`],

['E', 'Panel and rail',
 'The site&rsquo;s own chapter furniture: a panel with a narrow spine rail down \
the edge carrying the chapter, which is how the real league pages already mark \
one.', `
  <div class="s cE"><div class="pg">
    <div class="pn one"><div class="rail"><b>${K1}</b></div>
      <div class="bd"><h2>${H1}</h2><div class="dek">${D1}</div>${tbl(5)}</div></div>
    <div class="pn two"><div class="rail"><b>${K2}</b></div>
      <div class="bd"><h2>${H2}</h2><div class="dek">${D2}</div>${yrs(164)}</div></div>
  </div></div>`],

['F', 'Tabbed cards',
 'Two filed cards, each with a tab in its page&rsquo;s colour standing proud of \
the top edge. Scales to a deck: twenty chapters is twenty tabs, and the reader \
learns the colour code by slide four.', `
  <div class="s cF"><div class="pg">
    <div class="cd one"><span class="tab">Standings</span>
      <h2>${H1}</h2><div class="dek">${D1}</div>${tbl(5)}</div>
    <div class="cd two"><span class="tab">Seasons</span>
      <h2>${H2}</h2><div class="dek">${D2}</div>${yrs(158)}</div>
  </div></div>`],

];

document.getElementById('grid').innerHTML = CONCEPTS.map(([no, name, note, art]) => `
  <div class="tile">
