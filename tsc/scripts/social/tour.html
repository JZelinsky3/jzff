             b:{ page:'alltime', kick:'Chapter nine', t:'The All-Time <em>Team.</em>',
                 dek:'The best lineup a career could field.',
                 pull:['266.7','His best week at every slot, added up'],
                 fig:'alltime' } },

  /* 07 */ { kind:'plate', theme:'live', run:'Section two', num:'II',
             title:'The Live <em>Season.</em>',
             deck:'The same league, running in real time. It wakes in September and sleeps in January.',
             chapters:[
               ['11','Matchup Preview','Every week'], ['12','Pick&rsquo;ems','All season'],
               ['13','Power Rankings','Every Tuesday'], ['14','Best Coach','The bench'],
               ['15','Records Watch','Live chases'], ['16','Milestones','Countdowns'],
               ['17','The Trade Desk','Graded deals'], ['18','The Rumor Mill','Who asks'],
               ['19','Manager DNA','Habits'], ['20','Sunday Live','Game day'],
             ],
             stand:'It wakes up on the first Thursday of September on its own.',
             bottom:`<div style="margin-top:30px">
               <div class="kick" style="margin-bottom:14px">
                 The rhythm &nbsp;<u></u></div>
               <div class="plat">
                 <div class="p"><div class="n">Thursday</div>
                   <div class="s">The week ahead</div></div>
                 <div class="p"><div class="n">Sunday</div>
                   <div class="s">Live from kickoff</div></div>
                 <div class="p"><div class="n">Tuesday</div>
                   <div class="s">Rebuilt overnight</div></div>
                 <div class="p off"><div class="n">February</div>
                   <div class="s">It sleeps</div></div>
               </div>
             </div>` },

  /* 08 */ { kind:'spread', theme:'live', run:'The Live Season',
             a:{ kick:'Every Thursday', t:'Matchup <em>Preview.</em>',
                 dek:'What this week actually means.',
                 fig:'matchup' },
             b:{ kick:'All season', t:'The <em>Pick&rsquo;ems.</em>',
                 dek:'Everybody picks. The board remembers.',
                 pull:['12 of 12','Nobody forgets the week they went one for six'],
                 fig:'pickems' } },

  /* 09 */ { kind:'spread', theme:'live', run:'The Live Season',
             a:{ kick:'Every Tuesday', t:'Power <em>Rankings.</em>',
                 dek:'All twelve, ranked every Tuesday.',
                 fig:'power' },
             b:{ kick:'The hard one', t:'Best <em>Coach.</em>',
                 dek:'What you left on your own bench.',
                 pull:['264.3','Points Grant has benched this year'],
                 fig:'coach' } },

  /* 10 */ { kind:'spread', theme:'live', run:'The Live Season',
             a:{ kick:'Live', t:'Records <em>Watch.</em>',
                 dek:'The record book, pointed at right now.',
                 pull:['4','Chases live this week'],
                 fig:'watch' },
             b:{ kick:'Coming up', t:'The <em>Milestones.</em>',
                 dek:'Told the week before, not the March after.',
                 pull:['Before','Every countdown fires ahead of the game'],
                 fig:'milestones' } },

  /* 11 */ { kind:'trade', theme:'live', run:'The Live Season' },

  /* 12 */ { kind:'rest', theme:'slate', run:'Section three' },

  /* 13 */ { kind:'toc', theme:'almanac', run:'Contents' },

  /* 14 */ { kind:'close', theme:'almanac', run:'Start yours' },
];

const TOTAL = SLIDES.length;

/* ── the foot ───────────────────────────────────────────────── */
/* Two imprints, alternating, and no page number.
   The folio is gone from every sheet: "3 of 14" is furniture a bound
   book needs and a carousel does not, and at thumbnail size it just
   reads as a counter somebody forgot to take off.
   "Vol. II, No. 118, compiled from seven seasons" went with it. It
   meant nothing to the person who wrote the site, so it was never
   going to mean anything to somebody seeing it for the first time. */
const IMPRINTS = [
  () => `<span class="imp">thesundaychronicle.app</span>`,
  () => `<span class="mark"><b>The Sunday <em>Chronicle.</em></b>
           <s>Est. 2025</s></span>`,
];

function foot(n) {
  return `<div class="foot">${IMPRINTS[(n - 1) % IMPRINTS.length]()}</div>`;
}

const runHead = label => `<div class="run">
  <span class="sec">${esc(label)}</span><u></u><span class="orn">&#10022;</span>
</div>`;

/* ══════════════════════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════════════════════ */

const params = new URLSearchParams(location.search);
const n = Math.min(Math.max(parseInt(params.get('slide') || '1', 10), 1), TOTAL);
const s = SLIDES[n - 1];

applyTheme(s.theme);
const body = document.getElementById('body');

/* Each slide names its own surface. Running one ground under the
   whole deck is what made it read as fourteen of the same board, and
   a surface is only right for what is standing on it: wood under a
   shelf, baize under an almanac, cork under a record board. */
if (s.ground) document.getElementById('board').classList.add('is-room');
if (s.ground === 'news') document.getElementById('board').classList.add('is-ink');
const room = () => s.ground ? `<div class="ground g-${s.ground}"></div>` : '';

/* One chapter, as a bound volume lying on the desk: binding down the
   inner edge, header column on one side, figures on the other. `page`
   keys into PAGES, so the volume comes out in the real colours of the
   page it is showing. */
function half(cls, h) {
  const p = PAGES[h.page] || PAGES.chart;
  return `<div class="vol${cls === 'b' ? ' right' : ''}${p.pale ? ' pale' : ''}"
               style="--cloth:${p.cloth};--foil:${p.foil}">
    <div class="bind"></div>${s.pin ? '<span class="pin"></span>' : ''}
    <div class="half ${cls}">
      <div class="hd">
        <div class="kick">${esc(h.kick)}</div>
        <h2>${h.t}</h2>
        <div class="dek">${esc(h.dek)}</div>
        ${h.pull ? `<div class="pull"><div class="v">${h.pull[0]}</div>
                     <div class="k">${esc(h.pull[1])}</div></div>` : ''}
      </div>
      <div class="art">${FIG[h.fig]()}</div>
    </div>
  </div>`;
}

/* Slide one is the closed book, not a front page.
   The broadsheet version of it carried a masthead bar, a six-item
   wire and a three column contents strip — about a hundred and
   twenty words — and still left a band of dead cloth across its
   middle, because none of that is what stops a thumb. This is the
   binding seen head on: spine and hinge at the left, gilt fore-edge
   at the right, a blind-stamped frame, the nameplate in actual foil
   and five short lines in total. Everything that was cut is said
   later in the deck anyway. It carries no running head and no folio
   strap: a cover is not a page. */
if (s.kind === 'front') {
  document.getElementById('board').classList.add('is-cover');
  body.innerHTML = `
    <div class="cover cloth" style="--cloth:#101b27">
      <div class="raking"></div>
      <div class="spine"></div>
      <div class="hinge"></div>
      <div class="gilt"></div>
      <div class="board">
        <div class="frame">
          <span class="corn tl">&#10022;</span><span class="corn tr">&#10022;</span>
          <span class="corn bl">&#10022;</span><span class="corn br">&#10022;</span>

          <div class="edition"><span>Vol. II</span><span>No. 118</span></div>

          <div class="mid">
            <div class="over">The whole paper</div>
            <h1 class="stampfoil">The Sunday<br><em>Chronicle.</em></h1>
            <div class="foil" style="width:56%;margin-top:34px"></div>
            <p class="line">The record book your league never kept.</p>
          </div>

          <div class="seal"><i>&#10022;</i><b>TSC</b><s>Est. 2025</s></div>
          <div class="imprint">Sleeper &middot; ESPN &middot; Yahoo &middot; NFL.com</div>
          <div class="edition" style="margin-top:22px">
            <span>Est. 2025</span><span>Fantasy football</span></div>
        </div>
      </div>
    </div>`;

/* A section plate is a shelf when it has one (see PAGES). The
   chapter list is kept for the plates not converted yet. */
} else if (s.kind === 'plate') {
  body.innerHTML = room() + runHead(s.run) + `
    <div class="page">
      <div style="flex:none;display:flex;align-items:flex-start;gap:34px">
        <div class="roman">${s.num}</div>
        <div style="flex:1;padding-top:10px">
          <div class="nameplate" style="font-size:92px">${s.title}</div>
          <div style="margin-top:20px;font-size:24px;line-height:1.4;color:var(--soft)">
            ${esc(s.deck)}</div>
        </div>
      </div>
      <div class="foil" style="flex:none;margin:26px 0 24px"></div>
      ${s.shelf ? `
        <div class="shelf">
          <div class="row">${s.shelf.map(b => spine(b[0], b[1], b[2], b[3], b[4])).join('')}</div>
          <div class="plank"></div>
        </div>`
      : `<div class="chaplist">
          ${s.chapters.map(c => `<div class="c"><span class="no">${c[0]}</span>
            <span class="n">${c[1]}</span><span class="d">${c[2]}</span></div>`).join('')}
        </div>
        <div class="standfirst"><p>${s.stand}</p></div>`}
      ${s.bottom}
    </div>` + foot(n);

/* Two volumes on the desk. No gilded rule between them any more: the
   strip of desk showing through the gap is the cut, and it says the
   two halves are separate books, which a line never did. */
} else if (s.kind === 'spread') {
  body.innerHTML = room() + runHead(s.run) + `
    <div class="page" style="gap:24px">
      ${half('a', s.a)}
      ${half('b', s.b)}
    </div>` + foot(n);

/* The Trade Desk gets a page to itself: the ticket across the top,
   then the mill and the profile side by side under it, which is how
   the real page stacks them. */
} else if (s.kind === 'trade') {
  body.innerHTML = runHead(s.run) + `
    <div class="page">
      <div class="half a">
        <div class="hd">
          <div class="kick">Chapter seventeen</div>
          <h2>The Trade <em>Desk.</em></h2>
          <div class="dek">Every deal graded from both sides, on what the
            pieces are actually worth.</div>
          <div class="pull"><div class="v">14</div>
            <div class="k">Trades this season. Most since 2021</div></div>
        </div>
        <div class="art">${FIG.trade()}</div>
      </div>
      <div class="foil"></div>
      <div class="half b">
        <div class="hd">
          <div class="kick">Underneath it</div>
          <h2>The Rumor <em>Mill.</em></h2>
          <div class="dek">And who keeps asking.</div>
          <div class="pull"><div class="v">17</div>
            <div class="k">Offers Grant has sent. Two got taken</div></div>
        </div>
        <div class="art">${FIG.mill()}</div>
      </div>
    </div>` + foot(n);

/* Games above, Clubhouse below on a reversed cream panel: a paper
   drops a boxed feature into the foot of a broadsheet, and it gives
   the deck its one light surface. */
} else if (s.kind === 'rest') {
  body.innerHTML = runHead(s.run) + `
    <div class="page">
      <div class="half a">
        <div class="hd">
          <div class="kick">Section three</div>
          <h2>The <em>Games.</em></h2>
          <div class="dek">Dealt out of seasons your league actually played.</div>
          <div class="pull"><div class="v">Any league</div>
            <div class="k">Yours, the demo, or the whole site</div></div>
        </div>
        <div class="art">${FIG.games()}</div>
      </div>
      <div class="half b reverse" style="flex:.92">
        <div class="hd">
          <div class="kick">Free with any account</div>
          <h2 style="font-size:46px">The <em>Clubhouse.</em></h2>
          <div class="dek">Five rooms, open before you set anything up.</div>
        </div>
        <div class="art">${FIG.clubhouse()}</div>
      </div>
    </div>` + foot(n);

} else if (s.kind === 'toc') {
  const A = [['01','The Standings'], ['02','The Seasons'], ['03','The Record Book'],
             ['04','The Draft'], ['05','The Draft Grader'], ['06','The Managers'],
             ['07','The Manager File'], ['08','The Rivalries'], ['09','The Chart Room'],
             ['10','The All-Time Team'], ['11','The Mock Room']];
  const B = [['12','Matchup Preview'], ['13','Pick&rsquo;ems'], ['14','Power Rankings'],
             ['15','Best Coach'], ['16','Records Watch'], ['17','Milestones'],
             ['18','The Trade Desk'], ['19','The Rumor Mill'], ['20','Manager DNA'],
             ['21','Sunday Live']];
  const C = [['22','The Games'], ['23','The Clubhouse']];
  const col = (h, rows, p) => `<div class="col"><h3>${h}</h3>
    ${rows.map(r => `<div class="e"><span class="no">${r[0]}</span>
      <span class="n">${r[1]}</span><span class="dots"></span>
      <span class="p">${p}</span></div>`).join('')}</div>`;
  body.innerHTML = runHead(s.run) + `
    <div class="page">
      <div class="kick-c" style="text-align:left">Everything in the paper</div>
      <div class="nameplate" style="font-size:78px;margin-top:18px">
        Twenty-three <em>chapters.</em></div>
      <div class="foil" style="margin:26px 0 26px"></div>
      <div class="toc">
        ${col('Section I &middot; The Almanac', A, 'History')}
        ${col('Section II &middot; The Live Season', B, 'In season')}
      </div>
      <div class="toc short" style="margin-top:24px;padding-top:22px;
                                    border-top:1px solid var(--line)">
        ${col('Section III &middot; And the rest', C, 'Any time')}
        <div class="col" style="justify-content:center">
          <div style="font-family:var(--serif);font-style:italic;font-size:26px;
                      line-height:1.4;color:var(--soft)">
            All of it built out of games your<br>league has already played.</div>
        </div>
      </div>
    </div>` + foot(n);

} else if (s.kind === 'close') {
  body.innerHTML = runHead(s.run) + `
    <div class="page" style="justify-content:space-between">
      <div>
      <div class="mastbar">
        <span>Vol. II &middot; No. 118</span>
        <span class="mid">Sleeper &middot; ESPN &middot; Yahoo &middot; NFL.com</span>
        <span>Price: one league ID</span>
      </div>
      <div class="kick-c" style="text-align:left;margin-top:46px">Start your chronicle</div>
      <div class="nameplate" style="font-size:88px;margin-top:20px">
        Your league has a<br><em>paper trail.</em><br>Go and read it.</div>
      </div>

      <div class="offer">
        <div class="o">
          <div class="k">On signing up</div>
          <div class="v">30 days free</div>
          <div class="d">The whole paper. Nothing charged until it is over.</div>
        </div>
        <div class="o">
          <div class="k">Then, on your first bill</div>
          <div class="v">50% off</div>
          <div class="d">Enter this code at checkout.</div>
          <div class="coupon">FIRST50</div>
        </div>
      </div>
      <div style="margin-top:26px;display:flex;align-items:baseline;
                  font-family:var(--mono);font-size:16px;letter-spacing:.18em;
                  text-transform:uppercase;color:var(--soft)">
        <span>Ninety seconds to start</span>
        <span style="margin-left:auto;color:var(--mute)">Or read the demo first</span>
      </div>

      <!-- The back cover. The offer used to end two thirds down the
           sheet and the last slide of the deck closed on a quarter
           page of nothing. -->
      <div>
        <div class="foil" style="width:64%;margin:0 auto 30px"></div>
        <div class="nameplate" style="font-size:64px;text-align:center">
          The Sunday <em>Chronicle.</em></div>
        <div style="margin-top:20px;text-align:center;font-family:var(--mono);
                    font-size:19px;letter-spacing:.30em;text-transform:uppercase;
                    color:var(--gold)">thesundaychronicle.app</div>
      </div>
    </div>` + foot(n);
}
</script>
</body>
</html>
