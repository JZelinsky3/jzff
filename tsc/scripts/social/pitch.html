   already shown one finished thing, and every sheet ends on a line
   that asks.
   ══════════════════════════════════════════════════════════════ */

const SLIDES = [
  { kind:'front', theme:'almanac', run:'The pitch' },
  { kind:'blind', theme:'almanac', stock:'file',  run:'The blind spot' },
  { kind:'paper', theme:'almanac',                run:'The front page' },
  { kind:'file',  theme:'almanac', stock:'file',  run:'The manager file' },
  /* Slate's `rust` is the milestones violet, which came out as lilac
     grade chips on a sheet whose whole point is a failing mark. The
     exhibits borrow the almanac's red for it. */
  { kind:'exhibits', theme:'slate', vars:{ rust:'#b5573c' }, run:'The receipts' },
  { kind:'sunday', theme:'live',                  run:'Sunday' },
  { kind:'close', theme:'almanac',                run:'Start yours' },
];

const TOTAL = SLIDES.length;

const IMPRINTS = [
  () => `<span class="imp">thesundaychronicle.app</span>`,
  () => `<span class="mark"><b>The Sunday <em>Chronicle.</em></b>
           <s>Est. 2025</s></span>`,
];
const foot = n => `<div class="foot">${IMPRINTS[(n - 1) % IMPRINTS.length]()}</div>`;

const runHead = label => `<div class="run">
  <span class="sec">${esc(label)}</span><u></u><span class="orn">&#10022;</span>
</div>`;

const strap = (b, n) => `<div class="strap"><div class="b">${b}</div>
  <div class="n">${n}</div></div>`;

/* ══════════════════════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════════════════════ */

const params = new URLSearchParams(location.search);
const n = Math.min(Math.max(parseInt(params.get('slide') || '1', 10), 1), TOTAL);
const s = SLIDES[n - 1];

applyTheme(s.theme);
if (s.stock) applyStock(s.stock);
if (s.vars) for (const [k, v] of Object.entries(s.vars))
  document.getElementById('board').style.setProperty('--' + k, v);

const body = document.getElementById('body');

/* ── 01 the closed book ──────────────────────────────────────
   The same binding as the tour's cover, so the two posts are
   obviously the same publication, with one line changed: the tour
   opens on what the paper IS, this one opens on what the reader
   does not have. */
if (s.kind === 'front') {
  document.getElementById('board').classList.add('is-cover');
  body.innerHTML = `
    <div class="cover cloth" style="--cloth:#101b27">
      <div class="raking"></div>
      <div class="spine"></div>
      <div class="hinge"></div>
      <div class="gilt"></div>
      <div class="board">
        <div class="frame">
          <span class="corn tl">&#10022;</span><span class="corn tr">&#10022;</span>
          <span class="corn bl">&#10022;</span><span class="corn br">&#10022;</span>

          <div class="edition"><span>Vol. II</span><span>No. 118</span></div>

          <div class="mid">
            <div class="over">What your league is missing</div>
            <h1 class="stampfoil">The Sunday<br><em>Chronicle.</em></h1>
            <div class="foil" style="width:56%;margin-top:34px"></div>
            <p class="line">The record book your league never kept.</p>
          </div>

          <div class="seal"><i>&#10022;</i><b>TSC</b><s>Est. 2025</s></div>
          <div class="imprint">Sleeper &middot; ESPN &middot; Yahoo &middot; NFL.com</div>
          <div class="edition" style="margin-top:22px">
            <span>Est. 2025</span><span>Fantasy football</span></div>
        </div>
      </div>
    </div>`;

/* ── 02 the questionnaire ────────────────────────────────────
   Six things a league argues about and cannot settle, with the
   answers struck out, and the sixth left open so the sheet pays out
   instead of only teasing. Every question maps to a real page, and
   none of them says which. */
} else if (s.kind === 'blind') {
  const Q = [
    ['01', 'Who has scored the most points<br>and never won it?', [236, 132]],
    ['02', 'Which draft was the worst one<br>anybody has ever had?', [198, 156]],
    ['03', 'Who leaves the most points<br>sitting on their bench?', [170, 118]],
    ['04', 'Which trade actually won,<br>a year after it was made?', [252, 144]],
    ['05', 'Who owns who, all time,<br>and by how much?', [214, 166]],
  ];
  body.innerHTML = runHead(s.run) + `
    <div class="page">
      <div class="head-x" style="--h2:66px;--rw:196px">
        <div class="l">
          <h2>Six questions your<br>league <em>cannot answer.</em></h2>
        </div>
        <div class="r">Twelve managers<br>Ten seasons<br>Nothing written down</div>
      </div>
      <div class="foil" style="flex:none;margin:26px 0 8px"></div>
      <div class="qs">
        ${Q.map(([no, t, w]) => `<div class="q">
          <span class="no">${no}</span>
          <span class="t">${t}</span>
          <span class="a"><i class="redact" style="width:${w[0]}px"></i>
            <i class="redact sm" style="width:${w[1]}px"></i></span>
        </div>`).join('')}
        <div class="q open">
          <span class="no">06</span>
          <span class="t">What is the highest score<br>anyone has ever put up?</span>
          <span class="a"><span class="v">212.44</span>
            <span class="k">Drew &middot; Week 11 &middot; 2022</span></span>
        </div>
      </div>
      ${strap(`We answered the sixth one. The site answers <em>all six</em>
               about ninety seconds after you connect your league.`,
              'One league ID<br>Nothing to fill in')}
    </div>` + foot(n);

/* ── 03 the front page ───────────────────────────────────────
   Not a screenshot and not a feature: a whole printed page about
   one week of a league that does not exist. It is the only sheet in
   the deck that shows what the product hands you rather than what
   the product has. */
} else if (s.kind === 'paper') {
  body.innerHTML = runHead(s.run) + `
    <div class="page">
      <div class="mastbar" style="flex:none">
        <span>Vol. II &middot; No. 118</span>
        <span class="mid">Sunday, 23 November</span>
        <span>Week 12 of 14</span>
      </div>
      <div class="fp">
        <div class="lead">
          <h1>Bryce survives on a kicker,<br>and the <em>last bye is gone.</em></h1>
          <div class="sub">
            <p>Four points covered the top six on Sunday night. Nate, who had
              not lost since September, is suddenly playing for his life, and
              John has the most points in the league and nothing to show for it.</p>
            <div class="by">Written the<br>minute the<br>games ended</div>
          </div>
        </div>
        <div class="mid">
          <div class="m">
            <div class="kick" style="margin-bottom:14px">
              Points above the league &nbsp;<u></u>&nbsp; 2025</div>
            ${chart()}
          </div>
          <div class="s">${standings()}</div>
        </div>
      </div>
      ${strap(`This is one page, about one week. Your league already has
               <em>ten years</em> of them sitting in an app that will never
               print a single one.`,
              'Forty more pages<br>behind this one')}
    </div>` + foot(n);

/* ── 04 the file ─────────────────────────────────────────────
   The personal sheet. Everything else in the deck is about a
   league; this one is about a person, which is the sheet that gets
   sent to somebody in a group chat. */
} else if (s.kind === 'file') {
  body.innerHTML = runHead(s.run) + `
    <div class="page">
      <div class="mastbar" style="flex:none">
        <span>File No. 04</span>
        <span class="mid">Opened 2019 &middot; still open</span>
        <span>Twelve on file</span>
      </div>

      <div class="dossier" style="margin-top:24px">
        <div class="nm">Bryce</div>
        <div class="yr">Seven seasons<br>2019 to present</div>
        <div class="st"><i>&#9733;</i><i>&#9733;</i></div>
      </div>

      <div class="band" style="margin-top:22px">
        <div class="b"><div class="k">All-time</div><div class="v">78&ndash;40</div></div>
        <div class="b"><div class="k">Win pct</div><div class="v">.661</div></div>
        <div class="b on"><div class="k">Titles</div><div class="v">2</div></div>
        <div class="b"><div class="k">Playoffs</div><div class="v">6 of 7</div></div>
        <div class="b"><div class="k">Last place</div><div class="v">0</div></div>
      </div>

      <div style="flex:1;min-height:0;display:flex;padding:24px 0 0">
        <div style="flex:1.1;min-width:0;display:flex;flex-direction:column;
                    justify-content:space-between;padding-right:28px">
          <div>
            <div class="kick" style="margin-bottom:16px">
              Above the league &nbsp;<u></u>&nbsp; By season</div>
            ${seasonPM()}
          </div>
          <div>
            <div class="kick" style="margin-bottom:14px">
              Draft grades &nbsp;<u></u>&nbsp; Seven years</div>
            <div class="grades">
