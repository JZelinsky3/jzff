<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Font probe</title>
<!--
  DIAGNOSTIC, NOT A REAL EMAIL. Paste into a Resend broadcast, send it to
  yourself, open it in the Gmail app, and look at which lines actually differ
  from each other.

  Each row states one font a different way. Whichever rows render as a serif
  tell us what Gmail honours; whichever collapse to the same sans tell us
  what it ignores. That answers, with evidence rather than theory:

    · does Gmail honour inline font-family at all?          (rows 1, 2)
    · does an unresolvable name at the front break it?      (row 3 vs row 1)
    · does the old <font face> attribute still work?        (row 4)
    · does a class from the custom-CSS box reach it?        (row 5)

  Row 6 is the control: it asks for nothing, so it shows Gmail's default.
  If EVERY row looks like row 6, Gmail is ignoring typography entirely and
  there is nothing further to try.

  For row 5 to mean anything, put this in the Resend custom CSS box:
      .probe-class { font-family: Georgia, serif !important; }
-->
</head>
<body style="margin:0; padding:0; background:#ffffff;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff">
<tr><td align="center" style="padding:24px 12px;">
  <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px;">

    <tr><td style="padding:10px 16px; border-bottom:1px solid #ddd; font-family:Georgia, serif; font-size:26px; color:#111;">
      1. Georgia, serif
    </td></tr>

    <tr><td style="padding:10px 16px; border-bottom:1px solid #ddd; font-family:'Times New Roman', Times, serif; font-size:26px; color:#111;">
      2. Times New Roman, serif
    </td></tr>

    <tr><td style="padding:10px 16px; border-bottom:1px solid #ddd; font-family:'DM Serif Display', Georgia, serif; font-size:26px; color:#111;">
      3. DM Serif Display first, Georgia second
    </td></tr>

    <tr><td style="padding:10px 16px; border-bottom:1px solid #ddd; font-size:26px; color:#111;">
      <font face="Georgia, serif">4. font face attribute</font>
    </td></tr>

    <tr><td class="probe-class" style="padding:10px 16px; border-bottom:1px solid #ddd; font-size:26px; color:#111;">
      5. class from the custom CSS box
    </td></tr>

    <tr><td style="padding:10px 16px; border-bottom:1px solid #ddd; font-size:26px; color:#111;">
      6. control, no font requested
    </td></tr>

  </table>
</td></tr>
</table>
</body>
</html>
