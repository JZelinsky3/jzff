<style>
/* Mobile shell — the grader desktop ships 4 themes; on phones we
   drop the theme system and build a single purpose-tuned look in
   trades-grader-mobile.css (aubergine + copper palette, news-feed
   cards, side A/B color chips). App-bar + tab-bar pick the matching
   aubergine chrome here so the masthead doesn't fight the page. */
:root {
    --m-chrome-bg:  #0d0a14;
    --m-chrome-bg2: #14101c;
}
.m-appbar, .m-tabbar {
    --ink-line: #3a2e50;
    --gold: #e8a26c;
    --gold-deep: #d49260;
    --cream: #ede5f5;
    --cream-mute: #968aa6;
}
body {
    padding-top: calc(var(--m-appbar-h) + env(safe-area-inset-top));
    padding-bottom: calc(var(--m-tab-h) + env(safe-area-inset-bottom) + 12px);
}

/* Spinner — lives in main.css on desktop; ported here */
.tsc-spinner {
    display: block;
    width: 38px; height: 38px;
    margin: 0 auto 1rem;
    color: #f0c878;
    animation: tsc-spin 1.1s linear infinite;
}
.tsc-spinner[data-size="sm"] {
    display: inline-block;
    width: 14px; height: 14px;
    margin: 0 .45rem -2px 0;
    color: currentColor;
}
@keyframes tsc-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
    .tsc-spinner { animation: none; }
}
</style>
</head>
<body data-trade-desk-room="grader">

    <!-- Commissioner-only theme picker — rendered by trades.js when __DC.isCommish -->

    <div id="content">
        <div class="tr-empty">
            <svg class="tsc-spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
                <g transform="rotate(-45 12 12)">
                    <ellipse cx="12" cy="12" rx="8.5" ry="5.2"/>

    <div class="tr-footer" style="margin-top:2.2rem;text-align:center;font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;opacity:.45;">
        LSL · Trade Grader · Every deal marked up
    </div>

</main>

<script>
// Share lives in the app bar, not the page header. Sitting beside the
// title forced the title off-centre, and this page is meant to match the
// other Trade Desk rooms, which all centre their masthead. The bar's
// right slot floats absolutely, so the centred title stays centred.
(function () {
    function mount() {
        if (!window.__MA || !window.__MA.setAppbarRight) return false;
        window.__MA.setAppbarRight(
            '<button type="button" class="td-share-btn td-share-btn--bar" aria-label="Share the wire">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>' +
            '<line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>' +
            '</svg></button>',
            function () { if (window.TSCShare) window.TSCShare.open(); }
        );
        return true;
    }
    if (!mount()) document.addEventListener('DOMContentLoaded', mount);
})();
</script>
