    + '<path d="M11.6 15.2c1.7-1.9 3.7-2.7 6-2.4-1.7 1.9-3.7 2.7-6 2.4Z"/>'
    + '<path d="M14.2 10c1.1-2.2 2.8-3.5 5.2-3.9-1.1 2.3-2.8 3.6-5.2 3.9Z"/>'
    + '</svg>';

function niche(x, rank, alum) {
    return '<button type="button" class="niche' + (alum ? ' alum' : '') + (openUid === x.uid ? ' open' : '') + '"'
        + ' data-uid="' + C.esc(x.uid) + '" onclick="openCase(this.getAttribute(\'data-uid\'))">'
        + '<span class="n-lamp"></span>'
        + '<span class="n-light">' + PICTURE_LIGHT + '</span>'
        + '<span class="n-index">' + C.fmt(x.index) + '<i>Index</i></span>'
        + '<span class="n-top">'
        +   '<span class="n-side">'
        +     '<span class="n-rank">' + roman(rank) + '</span>'
        +     C.portrait(x, 'n-face')
        +   '</span>'
        +   '<span class="n-mid">'
        +     '<span class="n-name">' + C.esc(x.name) + '</span>'
        +     (x.team ? '<span class="n-team">' + C.esc(x.team) + '</span>' : '')
        +     '<span class="n-rec"><b>' + C.esc(x.record || '--') + '</b> &middot; ' + C.pct(x.win_pct)
        +       ' &middot; ' + x.seasons_played + ' seasons</span>'
        +     '<span class="n-cite">' + C.esc(C.citation(x)) + '</span>'
        +     '<span class="p-classplate">Enshrined</span>'
        +   '</span>'
        + '</span>'
        + '<span class="n-hw">'
        +   '<i class="n-laurel">' + LAUREL + '</i>'
        +   nicheHw(x)
        +   '<i class="n-laurel r">' + LAUREL + '</i>'
        + '</span>'
        + '</button>';
}

// The hardware as objects on the vitrine's own shelf, the count standing
// beside each piece the way it does on the chip rows. An empty shelf stays:
// an enshrined manager who got in on rate alone did, in fact, win nothing.
function nicheHw(x) {
    var t = x.trophies, out = '';
    function pc(cls, g, n, lb) {
        if (!n) return;
        out += '<span class="n-pc ' + cls + '" title="' + lb + '">' + g + '<b>' + n + '</b></span>';
    }
    pc('gold',   C.GLYPH.cup,      t.title,        'Champion');
    pc('silver', C.GLYPH.medal,    t.runner_up,    'Runner-up');
    pc('bronze', C.GLYPH.medal,    t.third,        'Third');
    pc('award',  C.GLYPH.orb,      t.moty,         'Manager of the Year');
    pc('royal',  C.GLYPH.crown,    t.reg_crown,    'Best record');
    pc('leaf',   C.GLYPH.football, t.points_title, 'Scoring title');
    return out;
}

function hwChips(x) {
    var t = x.trophies, hw = '';
    if (t.title)        hw += '<span class="gold">' + C.GLYPH.cup + t.title + '</span>';
    if (t.runner_up)    hw += '<span class="silver">' + C.GLYPH.medal + t.runner_up + '</span>';
    if (t.third)        hw += '<span class="bronze">' + C.GLYPH.medal + t.third + '</span>';
    if (t.moty)         hw += '<span class="award">' + C.GLYPH.orb + t.moty + '</span>';
    if (t.reg_crown)    hw += '<span class="royal">' + C.GLYPH.crown + t.reg_crown + '</span>';
    if (t.points_title) hw += '<span class="leaf">' + C.GLYPH.football + t.points_title + '</span>';
    return hw;
}

function standing(x) {
    if (x.status === 'enshrined') {
        // No year. Enshrinement here is a live standing, not a ceremony: the
        // bar floats and the hall is capped, so a manager can be pushed out by
        // someone better. Any year printed next to it would have to be
        // recomputed on every load and would move on its own, which is exactly
        // what a "Class of 2021" promises it will never do. The model still
        // carries class_year if a real, persisted induction date ever lands.
        return '<span class="p-classplate">Enshrined</span>';
    }
    return '<span class="p-tag tg-' + x.status + '"'
        + (x.status_note ? ' title="' + C.esc(x.status_note) + '"' : '') + '>'
        + C.esc(x.status_label) + '</span>';
}

function plaque(x, rank, side, alum) {
    return '<button type="button" class="plaque ' + side + ' ' + x.status + (alum ? ' alum' : '') + (openUid === x.uid ? ' open' : '') + '"'
        + ' data-uid="' + C.esc(x.uid) + '" onclick="openCase(this.getAttribute(\'data-uid\'))">'
        + '<span class="p-rank">' + roman(rank) + '</span>'
        + C.portrait(x, 'p-face')
        + '<span class="p-main">'
        +   '<span class="p-name">' + C.esc(x.name) + '</span>'
        +   (x.team ? '<span class="p-team">' + C.esc(x.team) + '</span>' : '')
        +   '<span class="p-rec"><b>' + C.esc(x.record || '--') + '</b> &middot; ' + C.pct(x.win_pct)
        +     ' &middot; ' + x.seasons_played + ' seasons</span>'
        +   standing(x)
        + '</span>'
        + '<span class="p-aisle">'
        +   '<b class="p-index">' + C.fmt(x.index) + '<i>Index</i></b>'
        +   '<span class="p-hw">' + hwChips(x) + '</span>'
        + '</span>'
        + '</button>';
}

/* ============================================================
   The reliquary.
   ============================================================ */
function openCase(uid) {
    openUid = openUid === uid ? null : uid;
    renderCase();
}

function renderCase() {
    document.querySelectorAll('.plaque, .niche').forEach(function (el) {
        el.classList.toggle('open', openUid != null && el.getAttribute('data-uid') === openUid);
    });
    var x = openUid && MODEL.managers.filter(function (r) { return r.uid === openUid; })[0];
    if (!x) {
        VEIL.innerHTML = '';
        document.body.style.overflow = '';
        return;
    }
    VEIL.innerHTML = '<div class="veil" onclick="if(event.target===this)openCase(null)">' + caseFor(x) + '</div>';
    document.body.style.overflow = 'hidden';
}

// One piece of hardware per accolade, the case read left to right the way
// the career was lived: earliest season first, and inside a season the
// placement trophy leads, then the award, then the two regular-season
// honours. The crown and the scoring title used to collapse into a single
// "3× crown" tally, which is why they had no year on them.
var HW_ORDER = { title: 0, runner: 1, third: 2, moty: 3, crown: 4, scoring: 5 };
function hardware(m) {
    var out = [];
    function add(yr, kind, cls, g, label) { out.push({ yr: yr, kind: kind, cls: cls, g: g, lb: label }); }

    m.title_years.forEach(function (y) { add(y, 'title', 'gold', C.GLYPH.cup, 'Champion'); });
    m.runner_years.forEach(function (y) { add(y, 'runner', 'silver', C.GLYPH.medal, 'Runner-up'); });
    m.third_years.forEach(function (y) { add(y, 'third', 'bronze', C.GLYPH.medal, 'Third'); });
    (m.moty_years || []).forEach(function (y) { add(y, 'moty', 'award', C.GLYPH.orb, 'MOTY'); });
    m.ledger.forEach(function (s) {
        // "Crown" is what the league calls it internally, but nobody reading a
        // shelf knows what a crown is for. Say what it was.
        if (s.reg_crown) add(s.year, 'crown', 'royal', C.GLYPH.crown, 'Best Record');
        if (s.points_title) add(s.year, 'scoring', 'leaf', C.GLYPH.football, 'Scoring');
    });

    out.sort(function (a, b) {
        return a.yr - b.yr || HW_ORDER[a.kind] - HW_ORDER[b.kind];
    });
    // Number the repeats in the order they were won, so the second crown wears
    // an x2 and the third an x3. Applied to every accolade, not just the three
    // that repeat most often — a second title deserves the tab as much as a
    // second scoring gong, and a rule with exceptions reads as a bug.
    var seen = {};
    out.forEach(function (h) {
        seen[h.kind] = (seen[h.kind] || 0) + 1;
        if (seen[h.kind] > 1) h.nth = seen[h.kind];
    });
    if (!out.length) out.push({ yr: '', kind: 'scoring', cls: '', g: C.GLYPH.football, lb: m.trophies.berth + ' berths' });
    return out;
}

// How many pieces stand on one shelf. The case is 860px at most and each
// piece is 74px wide, so a decorated career gets a second and third board
// rather than a horizontal scrollbar nobody finds.
function perShelf() {
    var w = window.innerWidth;
    if (w >= 760) return 6;
    if (w >= 560) return 4;
    return 3;
}

function shelves(m) {
    var pieces = hardware(m), per = perShelf(), out = '';
    for (var i = 0; i < pieces.length; i += per) {
        out += '<div class="hw-case"><div class="hw-row">'
             + pieces.slice(i, i + per).map(function (h) {
                   return '<div class="hw ' + h.cls + '">'
                        + (h.nth ? '<span class="hw-nth">x' + h.nth + '</span>' : '')
                        + '<div class="hw-obj">' + h.g + '</div>'
                        + '<div class="hw-cap"><div class="hw-yr">' + C.esc(h.yr) + '</div>'
                        +   '<div class="hw-lb">' + h.lb + '</div></div></div>';
               }).join('')
             + '</div><div class="hw-shelf"></div></div>';
    }
    return out;
}

// Top-three finishes. Counts the title too, the way a podium does.
function podiums(m) {
    var t = m.trophies;
    return t.title + t.runner_up + t.third;
}

function caseFor(m) {
    var en = m.status === 'enshrined';

    return '<article class="case" role="dialog" aria-modal="true" aria-label="' + C.esc(m.name) + '">'
        + '<div class="case-in">'
        + (m.is_current ? '' : '<div class="case-alum">Alumnus</div>')
        + '<button type="button" class="case-compare" data-uid="' + C.esc(m.uid) + '"'
        +   ' onclick="compareFrom(this.getAttribute(\'data-uid\'))">Compare</button>'
        + '<button type="button" class="case-close" onclick="openCase(null)">Close</button>'
        + '<div class="case-head">'
        +   C.portrait(m, 'case-portrait')
        +   '<div class="case-name' + (en ? '' : ' plain') + '">' + C.esc(m.name) + '</div>'
        +   (m.team ? '<div class="case-team">' + C.esc(m.team) + '</div>' : '')
        +   '<div class="case-standing">' + standing(m) + '</div>'
        +   '<p class="case-cite">' + C.esc(C.citation(m)) + '</p>'
        + '</div>'
        + shelves(m)
        + '<div class="case-plate">'
        +   '<div><div class="plate-k">Seasons</div><div class="plate-v">' + m.seasons_played + '</div></div>'
        +   '<div><div class="plate-k">Record</div><div class="plate-v">' + C.esc(m.record || '--') + '</div></div>'
        +   '<div><div class="plate-k">Titles</div><div class="plate-v">' + m.trophies.title + '</div></div>'
        +   '<div><div class="plate-k">Podiums</div><div class="plate-v">' + podiums(m) + '</div></div>'
        +   '<div style="text-align:right"><div class="plate-k">Index</div><div class="plate-index">' + C.fmt(m.index) + '</div></div>'
        + '</div>'
        + ledger(m)
        + '</div>'
        + '</article>';
}

function ledger(m) {
    var rows = m.ledger.slice().sort(function (a, b) { return b.year - a.year; }).map(function (s) {
        return '<div class="cl-row' + (s.final_rank === 1 ? ' title' : '') + '">'
            + '<div class="cl-yr">' + s.year + '</div>'
            + '<div class="cl-fin">' + C.ordinal(s.final_rank) + ' of ' + (s.teams || '--')
            +   (s.reg_crown ? ' &middot; best record' : '') + (s.points_title ? ' &middot; scoring title' : '') + '</div>'
            + '<div>' + C.esc(s.record || '--') + '</div>'
            + '<div>' + (s.all_play ? s.all_play.w + '-' + s.all_play.l : '--') + '</div>'
            + '<div class="cl-ppg">' + C.fmt(s.ppg) + '</div>'
            + '<div class="cl-q"><b style="width:' + Math.round(s.q * 100) + '%"></b></div>'
            + '</div>';
    }).join('');
    return '<div class="case-ledger">'
        + '<div class="cl-head"><span>Year</span><span>Finish</span><span>Record</span>'
        +   '<span>All-play</span><span>PPG</span><span>Season</span></div>'
        + rows + '</div>';
}

/* ============================================================
   THE RECKONING
   The Index is cred x (T-weight x trophy case + R-weight x season
   rate + P-weight x peak). Every one of those four numbers is
   knowable, so "why is he ahead of me" has an arithmetic answer
   and this section prints it rather than asking anyone to trust
   the ranking.
   ============================================================ */
function contribs(m) {
    var mix = MODEL.weights.mix, c = m.parts.credibility;
    return {
        trophy: { raw: m.parts.trophy, w: mix.T, val: c * mix.T * m.parts.trophy },
        rate:   { raw: m.parts.rate,   w: mix.R, val: c * mix.R * m.parts.rate },
        peak:   { raw: m.parts.peak,   w: mix.P, val: c * mix.P * m.parts.peak },
    };
}

var RK_ROWS = [
    ['trophy', 'Trophy case'],
    ['rate',   'Season rate'],
    ['peak',   'Peak run'],
];

function reckoning() {
    var list = MODEL.managers;
    var a = list.filter(function (m) { return m.uid === cmpA; })[0] || list[0];
    var b = list.filter(function (m) { return m.uid === cmpB; })[0] || list[1] || list[0];
    cmpA = a.uid; cmpB = b.uid;

    var ca = contribs(a), cb = contribs(b);
    // One shared scale across both managers and all three components, so a
    // bar's length means the same thing everywhere on the bench.
    var scale = 0;
    RK_ROWS.forEach(function (r) { scale = Math.max(scale, ca[r[0]].val, cb[r[0]].val); });
    scale = scale || 1;

    var rows = RK_ROWS.map(function (r) {
        var k = r[0], va = ca[k], vb = cb[k];
        return '<div class="rk-row">'
            + '<div class="rk-v a' + (va.val > vb.val ? ' win' : '') + '">' + C.fmt(va.val) + '</div>'
            + '<div class="rk-bar a"><b style="width:' + (va.val / scale * 100) + '%"></b></div>'
            + '<div class="rk-lab">' + r[1] + '<i>' + Math.round(va.w * 100) + '% of the Index</i></div>'
            + '<div class="rk-bar b"><b style="width:' + (vb.val / scale * 100) + '%"></b></div>'
            + '<div class="rk-v b' + (vb.val > va.val ? ' win' : '') + '">' + C.fmt(vb.val) + '</div>'
            + '</div>';
    }).join('');

    // Credibility is a multiplier, not a component, so it gets its own line
    // rather than a bar on the same scale.
    var credRow = (a.parts.credibility < 1 || b.parts.credibility < 1)
        ? '<div class="rk-row"><div class="rk-v a">' + C.fmt(a.parts.credibility, 2) + '</div>'
          + '<div class="rk-bar a"><b style="width:' + (a.parts.credibility * 100) + '%"></b></div>'
          + '<div class="rk-lab">Credibility<i>ramps in short careers</i></div>'
          + '<div class="rk-bar b"><b style="width:' + (b.parts.credibility * 100) + '%"></b></div>'
          + '<div class="rk-v b">' + C.fmt(b.parts.credibility, 2) + '</div></div>'
        : '';

    return '<div class="reckon"><div class="reckon-in">'
        + '<div class="rk-head">'
        +   picker('cmpA', a.uid) + '<div class="rk-vs">against</div>' + picker('cmpB', b.uid)
        + '</div>'
        + '<div class="rk-tops">'
        +   '<div class="rk-top">' + C.portrait(a, 'case-portrait')
        +     '<div class="rk-name">' + C.esc(a.name) + '</div>'
        +     (a.team ? '<div class="rk-team">' + C.esc(a.team) + '</div>' : '')
        +     '<div class="rk-idx">' + C.fmt(a.index) + '<i>Index</i></div></div>'
        +   '<div class="rk-gap">The gap<b>' + C.fmt(Math.abs(a.index - b.index)) + '</b></div>'
        +   '<div class="rk-top">' + C.portrait(b, 'case-portrait')
        +     '<div class="rk-name">' + C.esc(b.name) + '</div>'
        +     (b.team ? '<div class="rk-team">' + C.esc(b.team) + '</div>' : '')
        +     '<div class="rk-idx">' + C.fmt(b.index) + '<i>Index</i></div></div>'
        + '</div>'
        + '<p class="rk-verdict">' + verdict(a, b, ca, cb) + '</p>'
        + '<div class="rk-rows">' + rows + credRow
        +   '<div class="rk-row total">'
        +     '<div class="rk-v a' + (a.index > b.index ? ' win' : '') + '">' + C.fmt(a.index) + '</div>'
        +     '<div class="rk-bar a"><b style="width:' + (a.index / Math.max(a.index, b.index, 1) * 100) + '%"></b></div>'
        +     '<div class="rk-lab">Index<i>the sum</i></div>'
        +     '<div class="rk-bar b"><b style="width:' + (b.index / Math.max(a.index, b.index, 1) * 100) + '%"></b></div>'
        +     '<div class="rk-v b' + (b.index > a.index ? ' win' : '') + '">' + C.fmt(b.index) + '</div>'
        +   '</div>'
        + '</div>'
        + facts(a, b)
        + years(a, b)
        + '</div></div>';
}

function picker(which, sel) {
    var cur = MODEL.managers.filter(function (m) { return m.uid === sel; })[0];
    return '<div class="rk-pick" id="pick-' + which + '">'
        + '<button type="button" class="rk-pick-btn" onclick="toggleMenu(\'' + which + '\')">'
        +   '<span>' + C.esc(cur.name) + ' &middot; ' + C.fmt(cur.index) + '</span><i>&#9662;</i></button>'
        + '<div class="rk-menu" hidden>'
        + MODEL.managers.map(function (m) {
              return '<button type="button" class="rk-opt' + (m.uid === sel ? ' on' : '') + '"'
                  + ' data-uid="' + C.esc(m.uid) + '"'
                  + ' onclick="setCmp(\'' + which + '\', this.getAttribute(\'data-uid\'))">'
                  + C.portrait(m, 'rk-opt-face')
                  + '<span class="rk-opt-name">' + C.esc(m.name) + '</span>'
                  + '<b>' + C.fmt(m.index) + '</b></button>';
          }).join('')
        + '</div></div>';
}

// One menu open at a time. Picking a manager re-renders the whole bench, so
// the menu never needs to close itself on selection.
function toggleMenu(which) {
    var pick = document.getElementById('pick-' + which);
    var wasOpen = pick.classList.contains('open');
    closeMenus();
    if (!wasOpen) {
        pick.classList.add('open');
        pick.querySelector('.rk-menu').hidden = false;
    }
}

function closeMenus() {
    document.querySelectorAll('.rk-pick.open').forEach(function (p) {
        p.classList.remove('open');
        p.querySelector('.rk-menu').hidden = true;
    });
}

// Name the component that actually opened the gap, and say what it means in
// English. "He is ahead by 12" is useless; "he is ahead because of what he
// won, not how he played" is the answer people are actually asking for.
var RK_WHY = {
    trophy: 'what he has won',
    rate:   'how he plays in an average season',
    peak:   'how high his best stretch went',
};
function verdict(a, b, ca, cb) {
    if (a.uid === b.uid) return 'Pick two different managers.';
    var lead = a.index >= b.index ? a : b, trail = lead === a ? b : a;
    var lc = lead === a ? ca : cb, tc = lead === a ? cb : ca;
    var diffs = RK_ROWS.map(function (r) { return { k: r[0], d: lc[r[0]].val - tc[r[0]].val }; })
                       .sort(function (x, y) { return Math.abs(y.d) - Math.abs(x.d); });
    var top = diffs[0], back = diffs.filter(function (d) { return d.d < 0; });
    var s = '<b>' + C.esc(lead.name) + '</b> leads by ' + C.fmt(Math.abs(a.index - b.index))
          + ', and ' + (top.d >= 0 ? 'most of it is ' : 'oddly not ') + RK_WHY[top.k]
          + ' (' + (top.d >= 0 ? '+' : '') + C.fmt(top.d) + ').';
    if (back.length) {
        s += ' ' + C.esc(trail.name) + ' is actually ahead on '
           + back.map(function (d) { return RK_WHY[d.k]; }).join(' and ') + '.';
    }
    if (lead.parts.credibility < 1) {
        s += ' ' + C.esc(lead.name) + ' is still short of the ' + MODEL.constants.MIN_SEASONS
           + '-season bar, so his Index is held back to ' + Math.round(lead.parts.credibility * 100) + '%.';
    }
    return s;
}

// better: 1 = higher wins, -1 = lower wins, 0 = not a contest.
// o.scale: draw bars against this maximum. Omit for facts a bar would lie
//   about — a longer bar for a WORSE average finish, or for a record string.
// o.wide: the value is a record or a label, not a count, so shrink the type.
function factRow(label, va, vb, better, o) {
    o = o || {};
    var na = parseFloat(va), nb = parseFloat(vb);
    var num = isFinite(na) && isFinite(nb);
    var aw = better && num && (better > 0 ? na > nb : na < nb);
    var bw = better && num && (better > 0 ? nb > na : nb < na);
    var av = '<div class="rk-fv a' + (aw ? ' win' : '') + '">' + va + '</div>';
    var bv = '<div class="rk-fv b' + (bw ? ' win' : '') + '">' + vb + '</div>';
    // No bar to draw? Then the value moves INTO the bar's column, next to the
    // label, instead of sitting out on the rim with a field of nothing
    // between the two. Same five columns either way, so the rows still line up.
    if (!o.scale || !num) {
        return '<div class="rk-frow wide nobar"><div></div>' + av
             + '<div class="rk-flab">' + label + '</div>' + bv + '<div></div></div>';
    }
    function bar(v, side) {
        return '<div class="rk-bar ' + side + '"><b style="width:'
             + Math.max(0, Math.min(100, v / o.scale * 100)) + '%"></b></div>';
    }
    return '<div class="rk-frow' + (o.wide ? ' wide' : '') + '">'
        + av + bar(na, 'a')
        + '<div class="rk-flab">' + label + '</div>'
        + bar(nb, 'b') + bv + '</div>';
}

function facts(a, b) {
    var ta = a.trophies, tb = b.trophies;
    // One scale for the whole trophy case, so four podiums draws a longer bar
    // than one title instead of every row being pinned to its own maximum.
    var cabinet = Math.max(1, podiums(a), podiums(b),
        ta.title, tb.title, ta.runner_up, tb.runner_up, ta.third, tb.third,
        ta.moty, tb.moty, ta.reg_crown, tb.reg_crown, ta.points_title, tb.points_title);
    var yrs = Math.max(1, a.seasons_played, b.seasons_played);

    return '<div class="rk-facts">'
        + '<h4>The trophy case</h4>'
        + factRow('Titles', ta.title, tb.title, 1, { scale: cabinet })
        + factRow('Runner-up', ta.runner_up, tb.runner_up, 1, { scale: cabinet })
        + factRow('Third', ta.third, tb.third, 1, { scale: cabinet })
        + factRow('MOTY', ta.moty, tb.moty, 1, { scale: cabinet })
        + factRow('Best record', ta.reg_crown, tb.reg_crown, 1, { scale: cabinet })
        + factRow('Scoring', ta.points_title, tb.points_title, 1, { scale: cabinet })
        + factRow('Podiums', podiums(a), podiums(b), 1, { scale: cabinet })
        + '<h4>The career</h4>'
        + factRow('Seasons', a.seasons_played, b.seasons_played, 0, { scale: yrs })
        + factRow('Berths', ta.berth, tb.berth, 1, { scale: yrs })
        + factRow('Win %', C.pct(a.win_pct), C.pct(b.win_pct), 1, { scale: 1, wide: true })
        + factRow('Record', C.esc(a.record || '--'), C.esc(b.record || '--'), 0, { wide: true })
        + factRow('Playoffs', C.esc(a.playoff_record || '--'), C.esc(b.playoff_record || '--'), 0, { wide: true })
        + factRow('Avg finish', C.fmt(a.avg_finish), C.fmt(b.avg_finish), -1, { wide: true })
        + factRow('Standing', C.esc(a.status_label), C.esc(b.status_label), 0, { wide: true })
        + '</div>';
}

// Every season either played, on one row. A year only one of them played
// shows the other side empty, which is itself the answer sometimes.
function years(a, b) {
    var byYear = {};
    a.ledger.forEach(function (s) { (byYear[s.year] = byYear[s.year] || {}).a = s; });
    b.ledger.forEach(function (s) { (byYear[s.year] = byYear[s.year] || {}).b = s; });
    var side = function (s, cls) {
        if (!s) return '<div class="rk-side ' + cls + '"><span class="rk-none">did not play</span></div>';
        return '<div class="rk-side ' + cls + '">'
            + (cls === 'b' ? '<div class="rk-q"><b style="width:' + Math.round(s.q * 100) + '%"></b></div>' : '')
            + '<span>' + C.ordinal(s.final_rank) + '</span><u>' + C.esc(s.record || '') + '</u>'
            + (cls === 'a' ? '<div class="rk-q"><b style="width:' + Math.round(s.q * 100) + '%"></b></div>' : '')
            + '</div>';
    };
    var rows = Object.keys(byYear).sort().map(function (y) {
        return '<div class="rk-yrow">' + side(byYear[y].a, 'a')
             + '<div class="rk-yr">' + y + '</div>' + side(byYear[y].b, 'b') + '</div>';
    }).join('');
    return '<div class="rk-years"><div class="rk-yhead"><div style="text-align:right">Finish &middot; record</div>'
        + '<div class="rk-yr">Year</div><div>Finish &middot; record</div></div>' + rows + '</div>';
}

function setCmp(which, uid) {
    if (which === 'cmpA') cmpA = uid; else cmpB = uid;
    document.getElementById('reckon').innerHTML = reckoning();
}

// From inside a manager's case: put him on the left of the bench, keep
// whoever was already there on the right, and go look.
function compareFrom(uid) {
    if (cmpB === uid) cmpB = cmpA;
    cmpA = uid;
    openCase(null);
    document.getElementById('reckon').innerHTML = reckoning();
    setChap('cmp', true);
    document.getElementById('chap-cmp').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ══ Manager of the Year ═════════════════════════════════════ */
/* Weight order, not chronology. Finish alone is 35% of the ballot and is the
   widest band on nearly every bar, so it leads and the standings sit with it;
   everything after is the supporting detail, thinning left to right. Running
   it in season order (draft first, finish last) read better as a story and
   worse as a bar — the eye landed on the narrow end. The model emits its own
   order; this is a display decision and lives here. */
var CMP_ORDER = ['result', 'reg', 'draft', 'scoring', 'allplay', 'roster'];
var CMP_LABEL = { result: 'Finish', reg: 'Reg season', draft: 'Draft',
                  scoring: 'Scoring', allplay: 'All-play', roster: 'In-season' };
function cmpRank(k) { var i = CMP_ORDER.indexOf(k); return i < 0 ? 99 : i; }

/* Banners hang four to a rod at most and two at least, and the rows are
   levelled rather than filled: nine seasons hang 3/3/3, not 4/4/1. A lone
   banner on the bottom rod looks like something fell off the wall. */
function bannerCols() {
    var w = window.innerWidth;
    if (w >= 860) return 4;
    if (w >= 620) return 3;
    return 2;
}
function rackRows(n, cols) {
    var rows = Math.max(1, Math.ceil(n / cols));
    var base = Math.floor(n / rows), extra = n % rows, sizes = [];
    for (var i = 0; i < rows; i++) sizes.push(base + (i < extra ? 1 : 0));
    return sizes;
}
function racks() {
    var list = MODEL.moty, cols = bannerCols(), at = 0;
    return rackRows(list.length, cols).map(function (size) {
        var row = list.slice(at, at + size);
        at += size;
        return '<div class="banner-rack" style="--cols:' + cols + ';--n:' + size + '">'
             + '<div class="rod"></div>'
             + '<div class="banners">' + row.map(banner).join('') + '</div>'
             + '</div>';
    }).join('');
}

function banner(s) {
    var w = s.winner;
    var champ = s.champion === w.uid;
    return '<button type="button" class="banner' + (openYear === s.year ? ' open' : '') + '" onclick="toggleYear(' + s.year + ')">'
        + '<span class="bn">'
        + '<div class="bn-year">' + s.year
        +   (champ ? '<span class="cup">' + C.GLYPH.cup + '</span>' : '') + '</div>'
        + '<div class="bn-rule"></div>'
        + '<div class="bn-face">' + C.portrait(w, 'bn-portrait') + '</div>'
        + '<div class="bn-name">' + C.esc(w.name) + '</div>'
        + '<div class="bn-sub">' + C.esc(w.record || '') + ' &middot; ' + C.ordinal(w.final_rank) + '</div>'
        + '<div class="bn-champ">' + (champ ? 'Took the title too' : 'Title: <b>' + C.esc(championName(s)) + '</b>') + '</div>'
        + '<div class="bn-stack">' + stack(w, s.ballot[0].score) + '</div>'
        + '</span>'
        + '</button>';
}
function championName(s) {
    var c = s.ballot.filter(function (r) { return r.uid === s.champion; })[0];
    return c ? c.name : 'unknown';
}
/* Every bar on a ballot is measured against the WINNER's, who runs full
   width. A band's length is therefore its real contribution to the score, and
   lengths compare straight down the page: the longest draft band belongs to
   the best drafter that season, and the whole bar shows how close the field
   got to first.
   Normalising each row to its own total made every bar the same length and
   turned a low scorer's finish into a big share of a small number, which is
   why 11th could look like it out-finished 10th. Scaling to a flat 100
   fixed that but left every bar short of the rail with nothing at the end
   worth measuring against. */
function stack(r, top) {
    var total = r.parts.reduce(function (a, p) { return a + p.w * p.val; }, 0) || 1;
    var score = 100 * (r.score || 0) / (top || r.score || 1);
    return r.parts.slice()
        .sort(function (a, b) { return cmpRank(a.key) - cmpRank(b.key); })
        .map(function (p) { return { key: p.key, w: (p.w * p.val) / total * score }; })
        // A component worth nothing gets no band AND no divider. Last place
        // scores zero for finish, and an empty span still drew the hairline
        // its neighbour hangs off — a stray marker welded to the end of the
        // bar with no segment attached to it. Anything under half a percent
        // is thinner than its own divider, so it goes the same way.
        .filter(function (p) { return p.w > 0.5; })
        .map(function (p) { return '<span class="cmp-' + p.key + '" style="width:' + p.w + '%"></span>'; })
        .join('');
}

function toggleYear(y) {
    openYear = openYear === y ? null : y;
    document.querySelectorAll('.banner').forEach(function (el) { el.classList.remove('open'); });
    var host = document.getElementById('ballotOpen');
    if (openYear === null) { host.innerHTML = ''; return; }
    var s = MODEL.moty.filter(function (x) { return x.year === y; })[0];
    document.querySelectorAll('.banner')[MODEL.moty.indexOf(s)].classList.add('open');
    host.innerHTML = ballotPanel(s);
    host.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function ballotPanel(s) {
    var legend = s.components.slice().sort(function (a, b) { return cmpRank(a) - cmpRank(b); })
      .map(function (k) {
        return '<span><i class="cmp-' + k + '"></i>' + CMP_LABEL[k] + ' ' + Math.round(MODEL.weights.moty[k] * 100) + '%</span>';
    }).join('');
    var missing = CMP_ORDER.filter(function (k) { return s.components.indexOf(k) < 0; });
    var top = s.ballot[0] ? s.ballot[0].score : 0;
    var rows = s.ballot.map(function (r) {
        return '<div class="bo-row' + (r.rank === 1 ? ' win' : '') + '">'
            + '<div class="bo-rank">' + r.rank + '</div>'
            + '<div class="bo-name">' + C.esc(r.name) + '</div>'
            + '<div class="bo-fin">' + C.ordinal(r.final_rank) + '</div>'
            + '<div class="bo-stack">' + stack(r, top) + '</div>'
            + '<div class="bo-score">' + C.fmt(r.score) + '</div></div>';
    }).join('');
    return '<div class="scroll">'
        + '<div class="bo-head"><div class="bo-title">' + s.year + ' &middot; <b>' + C.esc(s.winner.name) + '</b></div>'
        +   '<div class="bo-legend">' + legend + '</div></div>' + rows
        + (missing.length ? '<div class="bo-missing">Not scored this season: '
            + missing.map(function (k) { return CMP_LABEL[k]; }).join(', ')
            + '. Weights renormalise over what the league has on file.</div>' : '')
        + '</div>';
}

function sheet() {
    var t = MODEL.weights.trophy, mix = MODEL.weights.mix, mw = MODEL.weights.moty;
    function line(k, v) { return '<div class="lc-line"><span>' + k + '</span><b>' + v + '</b></div>'; }
    return '<div class="sheet">'
        + '<h3>How the Index is built</h3>'
        + '<div class="lc-sub">Drawn from the league&rsquo;s own record. Nothing here is voted on.</div>'
        + '<div class="lc-cols">'
        +   '<div><h4>The trophy case</h4>'
        +     line('Championship', t.title) + line('Manager of the Year', t.moty)
        +     line('Runner-up', t.runner_up) + line('Best regular-season record', t.reg_crown)
        +     line('League scoring title', t.points_title) + line('Third place', t.third)
        +     line('Playoff berth', t.berth)
        +     '<h4 style="margin-top:1.4rem">The mix</h4>'
        +     line('Trophy case', Math.round(mix.T * 100) + '%') + line('Season-by-season rate', Math.round(mix.R * 100) + '%')
        +     line('Best three-year peak', Math.round(mix.P * 100) + '%') + '</div>'
        +   '<div><h4>Manager of the Year</h4>'
        +     line('Final standing', Math.round(mw.result * 100) + '%')
        +     line('Regular-season finish', Math.round(mw.reg * 100) + '%')
        +     line('All-play record', Math.round(mw.allplay * 100) + '%')
        +     line('Scoring power', Math.round(mw.scoring * 100) + '%')
        +     line('Draft class', Math.round(mw.draft * 100) + '%')
        +     line('In-season roster building', Math.round(mw.roster * 100) + '%')
        +     '<h4 style="margin-top:1.4rem">Enshrinement</h4>'
        +     line('Minimum seasons', MODEL.constants.MIN_SEASONS)
        +     line('Absolute floor', MODEL.constants.ABSOLUTE_FLOOR)
        +     line('Hall capped at', Math.round(MODEL.constants.HALL_SHARE * 100) + '% of eligible')
        +     line('Current bar', C.fmt(MODEL.bar)) + '</div>'
        + '</div>'
        + '<p class="lc-note"><b>Enshrined carries no year, because it is a standing rather than a ceremony.</b> '
        + 'The bar floats against the field and the hall is capped, so a manager <i>can</i> be pushed out by someone '
        + 'with a better case, and let back in when his own case grows again. Nobody is voted in on a date and '
        + 'nobody is in for life. The plate says where a career stands the moment you are looking at it.</p>'
        + '<p class="lc-note">Every season term is normalised inside its own season, so one scoring era never competes with '
        + 'another. The bar floats against the field you actually play in, which is how a three-year league and a twenty-year '
        + 'league both run this page honestly. Alumni keep their standing: leaving does not close a case.</p>'
        + '</div>';
}
</script>
</body>
</html>
