.rk-side.b .rk-q b { left: 0; background: linear-gradient(90deg, #9ab6cf, #5f7d96); }
.rk-none { color: rgba(239,227,196,.28); font-size: .6rem; }
.case-compare {
    position: absolute; top: 12px; right: 74px; z-index: 9;
    font-family: var(--display); font-weight: 700; font-size: .55rem; letter-spacing: .22em;
    text-transform: uppercase; color: var(--gilt-a); cursor: pointer; padding: .4rem .75rem;
    background: rgba(0,0,0,.35); border: 1px solid rgba(201,161,94,.55); border-radius: 2px;
}
.case-compare:hover { background: rgba(201,161,94,.2); }

/* ============================================================
   IV · THE PENNANTS
   One pennant a season on a steel cable, point flying right.
   ============================================================ */
.rod { position: relative; z-index: 3; height: 3px; margin: 0 auto -2px; border-radius: 2px;
       width: calc((100% - (var(--cols) - 1) * 20px) / var(--cols) * var(--n) + (var(--n) - 1) * 20px);
       background: linear-gradient(180deg, #6b7686, #39424e);
       box-shadow: 0 2px 5px rgba(0,0,0,.7); }
.rod::before, .rod::after {
    content: ''; position: absolute; top: 50%; transform: translateY(-50%);
    width: 12px; height: 12px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #9aa7b5, #39424e 65%);
    box-shadow: 0 2px 4px rgba(0,0,0,.7);
}
.rod::before { left: -6px; } .rod::after { right: -6px; }
.banner-rack { --cols: 4; --n: 4; padding: 0 14px; }
.banner-rack + .banner-rack { margin-top: 2.4rem; }
.banners { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 20px; padding-top: 10px; }
/* A pennant: felt, stitched border, hoist square to the cable. */
.banner {
    position: relative; font: inherit; color: inherit; cursor: pointer; border: 0;
    flex: 0 0 calc((100% - (var(--cols) - 1) * 20px) / var(--cols));
    min-height: 236px; text-align: center; padding: 1rem .9rem 3rem;
    background-image:
        var(--fleck),
        radial-gradient(110% 50% at 50% -4%, rgba(var(--sodium), .14), transparent 60%),
        linear-gradient(180deg, var(--felt-nvy-hi) 0%, var(--felt-nvy) 50%, var(--felt-nvy-lo) 100%);
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 40px), 50% 100%, 0 calc(100% - 40px));
    filter: drop-shadow(0 12px 10px rgba(0,0,0,.5));
    transition: transform .2s;
}
.banner:nth-child(even) {
    background-image:
        var(--fleck),
        radial-gradient(110% 50% at 50% -4%, rgba(var(--sodium), .14), transparent 60%),
        linear-gradient(180deg, var(--felt-red-hi) 0%, var(--felt-red) 50%, var(--felt-red-lo) 100%);
}
.banner::before {
    content: ''; position: absolute; inset: 7px; pointer-events: none;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 37px), 50% 100%, 0 calc(100% - 37px));
    border: 1.6px dashed rgba(239,227,196,.45);
}
.banner::after {
    content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: rgba(255,214,150,0); transition: background .2s;
}
.banner:hover { transform: translateY(4px); }
.banner:hover::after { background: rgba(255,214,150,.07); }
.banner.open { transform: translateY(5px); }
.banner.open::after { background: rgba(255,214,150,.1); }
.bn { position: relative; z-index: 1; }
.bn-year { font-family: var(--display); font-weight: 700; font-size: .82rem; letter-spacing: .3em;
           color: var(--gilt-a); padding-top: .3rem; text-shadow: 0 1px 0 rgba(0,0,0,.8); }
.bn-year .cup { display: inline-block; vertical-align: -2px; margin-left: .3rem; color: #f0c877; }
.bn-year .cup svg { width: 13px; height: 13px; }
.bn-year .cup svg path { stroke-dasharray: 2 1.4; }
.bn-rule { width: 46%; height: 1px; margin: .55rem auto 0;
           background: repeating-linear-gradient(90deg, rgba(239,227,196,.5) 0 4px, transparent 4px 7px); }
.bn-face { margin: .8rem auto .65rem; display: flex; justify-content: center; }
.bn-portrait {
    position: relative; display: inline-flex; align-items: center; justify-content: center;
    width: 54px; height: 54px; border-radius: 50%; overflow: hidden;
    background: #10151c;
    box-shadow: 0 0 0 2px rgba(0,0,0,.4), 0 0 0 4px var(--thread), 0 3px 6px rgba(0,0,0,.6);
}
.bn-portrait img { width: 100%; height: 100%; object-fit: cover; }
.bn-portrait i { display: none; font-style: normal; font-family: var(--display); font-weight: 600; font-size: 1rem; color: var(--gilt-b); }
.bn-portrait.is-mono i { display: block; }
.bn-name { font-family: var(--serif); font-size: 1.24rem; line-height: 1.05; color: var(--thread); padding: 0 .5rem; text-shadow: 0 1px 0 rgba(0,0,0,.7); }
.bn-sub { font-family: var(--mono); font-size: .56rem; letter-spacing: .06em; color: rgba(239,227,196,.6); margin-top: .45rem; }
.bn-champ { font-family: var(--sans); font-size: .6rem; color: rgba(239,227,196,.55); margin-top: .5rem; padding: 0 .8rem; }
.bn-champ b { color: var(--gilt-a); font-weight: 600; }
.bn-stack { display: flex; height: 7px; margin: .7rem 1rem 0; overflow: hidden;
            background: rgba(0,0,0,.34); box-shadow: 0 0 0 1px rgba(0,0,0,.45); }
.bn-stack span { display: block; height: 100%; }
.bn-stack span + span, .bo-stack span + span { box-shadow: inset 1px 0 0 rgba(0,0,0,.55); }

.cmp-result { background: #e6b74a; }
.cmp-reg    { background: #b79ae6; }
.cmp-draft  { background: #c3704f; }
.cmp-scoring{ background: #7d9cb8; }
.cmp-allplay{ background: #c987a8; }
.cmp-roster { background: #8dac7a; }

/* The ballot: the official scorer's sheet, white paper on a clipboard. */
.scroll {
    position: relative; margin-top: 2.4rem; padding: 2.3rem 2.4rem 2.1rem;
    color: #24313f;
    background-image:
        var(--fleck),
        radial-gradient(120% 100% at 50% 0%, rgba(255,255,255,.5), transparent 40%),
        linear-gradient(180deg, #f4efe2 0%, #e9e2d0 60%, #d9d0ba 100%);
    border-radius: 3px;
    box-shadow: inset 0 0 40px rgba(90,90,70,.18), 0 16px 30px rgba(0,0,0,.6);
}
.scroll::before {   /* the clipboard clip */
    content: ''; position: absolute; top: -11px; left: 50%; transform: translateX(-50%);
    width: 96px; height: 20px; border-radius: 10px 10px 3px 3px;
    background: linear-gradient(180deg, #8b98a8, #4a5563 60%, #2a323d);
    box-shadow: 0 3px 6px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.35);
}
.scroll::after { content: none; }
.bo-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: .8rem; margin-bottom: 1.15rem; }
.bo-title { font-family: var(--fell); font-size: 1.5rem; color: #24313f; }
.bo-title b { color: #8c1f28; font-weight: 400; }
.bo-legend { display: flex; gap: .9rem; flex-wrap: wrap; font-family: var(--mono); font-size: .55rem; letter-spacing: .12em; text-transform: uppercase; color: #5d6a78; }
.bo-legend span { display: inline-flex; align-items: center; gap: .35rem; }
.bo-legend i { width: 9px; height: 9px; display: inline-block; box-shadow: 0 0 0 1px rgba(36,49,63,.3); }
.bo-row { display: grid; grid-template-columns: 2rem 1fr 4.4rem minmax(130px, 2fr) 3.4rem; gap: .85rem; align-items: center;
          padding: .5rem 0; border-bottom: 1px solid rgba(36,49,63,.16); }
.bo-row:last-child { border-bottom: 0; }
.bo-rank { font-family: var(--mono); font-size: .72rem; color: #5d6a78; }
.bo-name { font-family: var(--fell); font-size: 1.06rem; color: #24313f; }
.bo-row.win .bo-name { color: #8c1f28; }
.bo-row.win .bo-rank { color: #8c1f28; }
.bo-fin { font-family: var(--mono); font-size: .64rem; color: #5d6a78; }
.bo-stack { display: flex; height: 9px; overflow: hidden; background: rgba(36,49,63,.1); box-shadow: 0 0 0 1px rgba(36,49,63,.18); }
.bo-stack span { display: block; height: 100%; }
.bo-score { font-family: var(--fell); font-size: 1.05rem; color: #24313f; text-align: right; }
.bo-missing { margin-top: 1.05rem; font-family: var(--fell); font-style: italic; font-size: .84rem; color: #5d6a78; }

/* ============================================================
   V · THE CHALKBOARD
   ============================================================ */
.sheet {
    position: relative; max-width: 880px; margin: 0 auto; padding: 2.6rem 2.7rem 2.9rem;
    color: var(--chalk);
    background-image:
        var(--fleck),
        radial-gradient(120% 100% at 50% 0%, rgba(255,255,255,.05), transparent 50%),
        linear-gradient(180deg, var(--board) 0%, var(--board-lo) 100%);
    border: 10px solid transparent; border-radius: 4px;
    background-origin: border-box;
    background-clip: padding-box, padding-box, padding-box;
    box-shadow:
        0 0 0 1px #0a0806,
        0 18px 34px rgba(0,0,0,.6);
}
/* The wood frame, painted into the border band. */
.sheet::before {
    content: ''; position: absolute; inset: -10px; z-index: -1; border-radius: 4px;
    background-image: var(--grain), linear-gradient(180deg, var(--wood-hi), var(--wood) 55%, var(--wood-lo));
    box-shadow: inset 0 1px 0 rgba(255,222,160,.2);
}
/* Chalk dust in the tray. */
.sheet::after {
    content: ''; position: absolute; left: 8%; right: 8%; bottom: 2px; height: 5px;
    background: linear-gradient(90deg, transparent, rgba(230,234,216,.18) 30%, rgba(230,234,216,.08) 60%, transparent);
}
.sheet h3 { font-family: var(--display); font-weight: 700; font-size: 1.12rem; letter-spacing: .2em; text-transform: uppercase; color: var(--chalk); text-align: center;
            text-shadow: 0 0 6px rgba(230,234,216,.25); }
.sheet .lc-sub { text-align: center; font-family: var(--fell); font-style: italic; font-size: .95rem; color: var(--chalk-mut); margin: .5rem 0 1.8rem; }
.lc-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 2.4rem; }
.lc-cols h4 { font-family: var(--display); font-weight: 700; font-size: .62rem; letter-spacing: .3em; text-transform: uppercase; color: #f0c877; margin-bottom: .8rem;
              border-bottom: 1px dashed rgba(230,234,216,.35); padding-bottom: .4rem; }
.lc-line { display: flex; justify-content: space-between; gap: 1rem; padding: .34rem 0; border-bottom: 1px dashed rgba(230,234,216,.16);
           font-family: var(--fell); font-size: .95rem; color: var(--chalk); }
.lc-line b { font-family: var(--mono); font-size: .78rem; font-weight: 700; color: #fff; }
.lc-note { margin-top: 1.6rem; font-family: var(--fell); font-style: italic; font-size: .95rem; line-height: 1.7; color: var(--chalk-mut); }

.loading { text-align: center; padding: 5rem 1rem; font-family: var(--fell); font-style: italic; color: var(--cream-mute); }
.errbox { text-align: center; padding: 3rem 1rem; color: var(--rust); font-family: var(--mono); font-size: .8rem; }

@media (max-width: 1240px) {
    .bn-hang { width: min(268px, 100%); }
    .rf-name { font-size: 1.3rem; }
    .rf-face { width: 76px; height: 76px; }
    .rf-idx { font-size: 2.2rem; }
}
@media (max-width: 940px) {
    .bannerrow { flex-wrap: wrap; }
    .lockers { gap: .8rem; }
    .locker { width: 188px; }
    .lc-cols { grid-template-columns: 1fr; gap: 1.4rem; }
    .scroll, .sheet { padding-left: 1.3rem; padding-right: 1.3rem; }
    .cl-head, .cl-row { grid-template-columns: 2.8rem 1fr 3.8rem 4rem; }
    .cl-head span:nth-child(5), .cl-row .cl-ppg,
    .cl-head span:nth-child(6), .cl-row .cl-q { display: none; }
    .bo-row { grid-template-columns: 1.6rem 1fr 3.2rem; }
    .bo-row .bo-stack, .bo-row .bo-fin { display: none; }
    .lamp i { width: 260px; }
}
@media (max-width: 620px) {
    .rk-row, .rk-frow { grid-template-columns: 2.6rem 1fr 1fr 2.6rem; gap: .3rem .45rem; }
    .rk-lab, .rk-flab { grid-column: 1 / -1; order: -1; }
    .rk-lab i { display: inline; margin: 0 0 0 .45rem; }
    .rk-frow.wide { grid-template-columns: 1fr 8rem 1fr; }
    .rk-frow.wide .rk-bar { display: none; }
    .rk-frow.wide .rk-flab { grid-column: auto; order: 0; }
    .rk-fv { font-size: .92rem; }
    .rk-head { grid-template-columns: 1fr; }
    .rk-vs { text-align: center; }
    .rk-tops { grid-template-columns: 1fr 1fr; }
    .rk-gap { grid-column: 1 / -1; order: 3; margin-top: 1rem; }
    .rk-side u { display: none; }
    .rk-q { max-width: 70px; }
    .reckon-in { padding-left: 1rem; padding-right: 1rem; }
    .banner { min-height: 220px; }
    .locker { width: 164px; }
}
@media (max-width: 560px) {
    .hw-row { gap: .5rem; margin-left: 1rem; margin-right: 1rem; }
    .hw { width: 54px; }
}
@media (prefers-reduced-motion: reduce) {
    .locker, .raft, .banner { transition: none !important; }
    .veil, .case, .lamp i { animation: none !important; }
}
</style>
</head>
<body>

<div class="bowl"></div>

<div id="switch"></div>

<div class="wrap">
    <header class="mast">
        <div class="mast-kick">The Society Almanac</div>
        <h1 class="mast-title">The Rafters</h1>
        <p class="mast-sub" id="mastSub">Flipping the breakers&hellip;</p>
    </header>
    <div id="body"><div class="loading">Warming up the sodium lamps&hellip;</div></div>
</div>

<script src="/pams-template/assets/js/draft-grade.js"></script>
<script src="hof-model.js"></script>
<script src="hall-common.js"></script>
<script>
var C = window.HallCommon;
var P = C.params();
var MODEL = null;
var openUid = null;
var openYear = null;
var cmpA = null, cmpB = null;

document.getElementById('switch').innerHTML = C.switcher('The Rafters');

var VEIL = document.createElement('div');
document.body.appendChild(VEIL);
document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    closeMenus();
    if (openUid) openCase(null);
});
document.addEventListener('click', function (e) { if (!e.target.closest('.rk-pick')) closeMenus(); });

var lastCut = null, cutTimer = null;
window.addEventListener('resize', function () {
    clearTimeout(cutTimer);
    cutTimer = setTimeout(function () {
        if (!MODEL) return;
        var cut = bannerCols() + ':' + perShelf();
        if (cut === lastCut) return;
        lastCut = cut;
        var host = document.getElementById('racks');
        if (host) host.innerHTML = racks();
        if (openYear !== null) {
            var i = MODEL.moty.map(function (x) { return x.year; }).indexOf(openYear);
            if (i >= 0) document.querySelectorAll('.banner')[i].classList.add('open');
        }
        renderCase();
    }, 140);
});

window.HOF.load({ league: P.league }).then(function (m) {
    MODEL = m;
    document.getElementById('protoSrc').textContent = C.sourceLabel(m, P);
    render();
}).catch(function (err) {
    document.getElementById('body').innerHTML = '<div class="errbox">Could not light the arena.<br>' + C.esc(err.message) + '</div>';
});

function render() {
    var m = MODEL;
    document.getElementById('mastSub').innerHTML =
        C.esc(m.league.name) + ' &middot; <b>' + m.inducted.length + '</b> in the rafters &middot; '
        + '<b>' + m.eligible_count + '</b> eligible &middot; bar at <b>' + C.fmt(m.bar) + '</b>';

    document.getElementById('body').innerHTML =
          '<div id="arenaHost">' + arena() + '</div>'
        + chap('Tale of the Tape', 'Two careers on one card. The Index is three numbers added up, '
            + 'so a gap between two managers can be pointed at rather than argued about.', 'cmp')
        + '<div class="fold narrow" id="fold-cmp" hidden><div id="reckon">' + reckoning() + '</div></div>'
        + chap('Manager of the Year', 'One pennant a season. Open one and the official ballot comes off the clipboard.')
        + '<div class="narrow"><div id="racks">' + racks() + '</div>'
        + '<div id="ballotOpen"></div></div>'
        + chap('The Chalkboard', 'How the Index is built, and what it takes to hang a banner.', 'method')
        + '<div class="fold" id="fold-method" hidden>' + sheet() + '</div>';
    lastCut = bannerCols() + ':' + perShelf();
    renderCase();
}

function chap(title, note, id) {
    var head = id
        ? '<button type="button" class="ribbon rib-btn" id="rib-' + id + '" aria-expanded="false"'
          + ' aria-controls="fold-' + id + '" onclick="toggleChap(\'' + id + '\')">'
          + C.esc(title) + '<span class="rib-caret">&#9662;</span></button>'
        : '<span class="ribbon">' + C.esc(title) + '</span>';
    return '<section class="chap" id="chap-' + (id || '') + '"><h2>' + head + '</h2>'
         + (note ? '<div class="chap-note">' + C.esc(note) + '</div>' : '') + '</section>';
}

function toggleChap(id) { setChap(id, document.getElementById('fold-' + id).hidden); }

function setChap(id, open) {
    var fold = document.getElementById('fold-' + id), rib = document.getElementById('rib-' + id);
    if (!fold) return;
    fold.hidden = !open;
    rib.classList.toggle('open', open);
    rib.setAttribute('aria-expanded', String(open));
}

function roman(n) {
    var t = [[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
    var s = '';
    t.forEach(function (p) { while (n >= p[0]) { s += p[1]; n -= p[0]; } });
    return s || '&middot;';
}

/* ============================================================
   I / II · The arena: banners above, lockers below.
   ============================================================ */
function isEn(x) { return x.status === 'enshrined'; }
function notEn(x) { return x.status !== 'enshrined'; }

function arena() {
    var m = MODEL;
    var current = m.managers.filter(function (x) { return x.is_current; });
    var alumni  = m.managers.filter(function (x) { return !x.is_current; });
    var en = current.filter(isEn), rest = current.filter(notEn);
    var aEn = alumni.filter(isEn), aRest = alumni.filter(notEn);

    // A lamp over every banner, spread across the truss.
    var lamps = en.map(function (_, i) {
        var pct = en.length === 1 ? 50 : 12 + (76 * i / (en.length - 1));
        return '<span class="lamp" style="left:' + pct + '%"><i></i></span>';
    }).join('');

    return '<div class="arena">'
        + '<div class="truss"></div>'
        + '<div class="lamps">' + lamps + '</div>'
        + '<div class="rafterwall"><div class="bannerrow">'
        +   en.map(function (x, i) { return hang(x, i + 1, false); }).join('')
        +   (aEn.length ? aEn.map(function (x, i) { return hang(x, current.length + 1 + i, true); }).join('') : '')
        + '</div></div>'
        + '<div class="concourse">'
        +   '<div class="crail">The Concourse &middot; the lockers</div>'
        +   '<div class="lockers">'
        +     rest.map(function (x, i) { return locker(x, en.length + 1 + i, false); }).join('')
        +   '</div>'
        +   (aRest.length
              ? '<div class="crail" style="margin-top:1.6rem"><button type="button" class="rail-btn" id="rib-alum"'
                +   ' aria-expanded="false" aria-controls="fold-alum" onclick="toggleChap(\'alum\')">'
                +   'Storage &middot; alumni <i>' + aRest.length + '</i><span class="rib-caret">&#9662;</span></button></div>'
                + '<div class="fold storage" id="fold-alum" hidden><div class="lockers">'
                +   aRest.map(function (x, i) { return locker(x, current.length + aEn.length + 1 + i, true); }).join('')
                + '</div></div>'
              : '')
        + '</div>'
        + '</div>';
}

/* Embroidered accolade patches. The stroke glyph set IS the embroidery:
   a running-stitch dasharray does the rest. */
function patches(x, max) {
    var t = x.trophies, out = [], n = 0;
    function pc(cls, g, count, lb) {
        if (!count) return;
        n++;
        if (max && n > max) return;
        out.push('<span class="patch ' + cls + '" title="' + lb + '">' + g
            + (count > 1 ? '<b>' + count + '</b>' : '') + '</span>');
    }
    pc('gold',   C.GLYPH.cup,      t.title,        'Champion');
    pc('silver', C.GLYPH.medal,    t.runner_up,    'Runner-up');
    pc('bronze', C.GLYPH.medal,    t.third,        'Third');
    pc('award',  C.GLYPH.orb,      t.moty,         'Manager of the Year');
    pc('royal',  C.GLYPH.crown,    t.reg_crown,    'Best record');
    pc('leaf',   C.GLYPH.football, t.points_title, 'Scoring title');
    return out.join('');
}

function hang(x, rank, alum) {
    var hw = patches(x);
    return '<div class="bn-hang">'
        + '<button type="button" class="raft' + (alum ? ' alum' : '') + (openUid === x.uid ? ' open' : '') + '"'
        + ' data-uid="' + C.esc(x.uid) + '" onclick="openCase(this.getAttribute(\'data-uid\'))">'
        + '<span class="rf-stitch"></span>'
        + '<span class="rf">'
        +   '<span class="rf-kick" style="display:block">' + (alum ? 'Alumnus &middot; Enshrined' : 'Enshrined') + '</span>'
        +   '<span class="rf-rank">' + roman(rank) + '</span>'
        +   '<span style="display:block">' + C.portrait(x, 'rf-face') + '</span>'
        +   '<span class="rf-name" style="display:block">' + C.esc(x.name) + '</span>'
        +   (x.team ? '<span class="rf-team" style="display:block">' + C.esc(x.team) + '</span>' : '')
        +   '<span class="rf-idx" style="display:block">' + C.fmt(x.index) + '<i>Index</i></span>'
        +   '<span class="rf-rec" style="display:block"><b>' + C.esc(x.record || '--') + '</b> &middot; ' + C.pct(x.win_pct)
        +     ' &middot; ' + x.seasons_played + ' seasons</span>'
        +   '<span class="rf-hw">' + (hw || '<span class="rf-none">The Index alone hung this banner.</span>') + '</span>'
        + '</span>'
        + '</button>'
        + '</div>';
}

function locker(x, rank, alum) {
    return '<button type="button" class="locker' + (openUid === x.uid ? ' open' : '') + '"'
        + ' data-uid="' + C.esc(x.uid) + '" onclick="openCase(this.getAttribute(\'data-uid\'))">'
        + '<span class="lk-vent"></span>'
        + '<span class="lk-plate">' + C.esc(x.name) + '</span>'
        + C.portrait(x, 'lk-face')
        + '<span class="lk-idx" style="display:block">' + C.fmt(x.index) + '<i>Index</i></span>'
        + '<span class="lk-rec" style="display:block">' + C.esc(x.record || '--') + ' &middot; ' + C.pct(x.win_pct) + '</span>'
        + '<span class="lk-hw">' + patches(x) + '</span>'
        + '<span class="lk-tag tg-' + x.status + '">' + C.esc(x.status_label) + '</span>'
        + '</button>';
}

/* ============================================================
   The reliquary.
   ============================================================ */
function openCase(uid) {
    openUid = openUid === uid ? null : uid;
    renderCase();
}

function renderCase() {
    document.querySelectorAll('.locker, .raft').forEach(function (el) {
        el.classList.toggle('open', openUid != null && el.getAttribute('data-uid') === openUid);
    });
    var x = openUid && MODEL.managers.filter(function (r) { return r.uid === openUid; })[0];
    if (!x) {
        VEIL.innerHTML = '';
        document.body.style.overflow = '';
        return;
    }
    VEIL.innerHTML = '<div class="veil" onclick="if(event.target===this)openCase(null)">' + caseFor(x) + '</div>';
    document.body.style.overflow = 'hidden';
}

var HW_ORDER = { title: 0, runner: 1, third: 2, moty: 3, crown: 4, scoring: 5 };
var HW_CLS = { title: 'gold', runner: 'silver', third: 'bronze', moty: 'award', crown: 'royal', scoring: 'leaf' };
function hardware(m) {
    var out = [];
    function add(yr, kind, g, label) { out.push({ yr: yr, kind: kind, cls: HW_CLS[kind], g: g, lb: label }); }
    m.title_years.forEach(function (y) { add(y, 'title', C.GLYPH.cup, 'Champion'); });
    m.runner_years.forEach(function (y) { add(y, 'runner', C.GLYPH.medal, 'Runner-up'); });
    m.third_years.forEach(function (y) { add(y, 'third', C.GLYPH.medal, 'Third'); });
    (m.moty_years || []).forEach(function (y) { add(y, 'moty', C.GLYPH.orb, 'MOTY'); });
    m.ledger.forEach(function (s) {
        if (s.reg_crown) add(s.year, 'crown', C.GLYPH.crown, 'Best Record');
        if (s.points_title) add(s.year, 'scoring', C.GLYPH.football, 'Scoring');
    });
    out.sort(function (a, b) { return a.yr - b.yr || HW_ORDER[a.kind] - HW_ORDER[b.kind]; });
    var seen = {};
    out.forEach(function (h) {
        seen[h.kind] = (seen[h.kind] || 0) + 1;
        if (seen[h.kind] > 1) h.nth = seen[h.kind];
    });
    if (!out.length) out.push({ yr: '', kind: 'scoring', cls: 'leaf', g: C.GLYPH.football, lb: m.trophies.berth + ' berths' });
    return out;
}

function perShelf() {
    var w = window.innerWidth;
    if (w >= 760) return 6;
    if (w >= 560) return 4;
    return 3;
}

function shelves(m) {
    var pieces = hardware(m), per = perShelf(), out = '';
    for (var i = 0; i < pieces.length; i += per) {
        out += '<div class="hw-case"><div class="hw-row">'
             + pieces.slice(i, i + per).map(function (h) {
                   return '<div class="hw ' + h.cls + '">'
                        + (h.nth ? '<span class="hw-nth">x' + h.nth + '</span>' : '')
                        + '<span class="patch ' + h.cls + '">' + h.g + '</span>'
                        + '<div class="hw-cap"><div class="hw-yr">' + C.esc(h.yr) + '</div>'
                        +   '<div class="hw-lb">' + h.lb + '</div></div></div>';
               }).join('')
             + '</div></div>';
    }
    return out;
}

function podiums(m) {
    var t = m.trophies;
    return t.title + t.runner_up + t.third;
}

function standing(x) {
    if (x.status === 'enshrined') return '<span class="rf-tab">Enshrined</span>';
    return '<span class="lk-tag tg-' + x.status + '"'
        + (x.status_note ? ' title="' + C.esc(x.status_note) + '"' : '') + '>'
        + C.esc(x.status_label) + '</span>';
}

function caseFor(m) {
    var en = m.status === 'enshrined';
    return '<article class="case" role="dialog" aria-modal="true" aria-label="' + C.esc(m.name) + '">'
        + '<div class="case-in">'
        + (m.is_current ? '' : '<div class="case-alum">Alumnus</div>')
        + '<button type="button" class="case-compare" data-uid="' + C.esc(m.uid) + '"'
        +   ' onclick="compareFrom(this.getAttribute(\'data-uid\'))">Compare</button>'
        + '<button type="button" class="case-close" onclick="openCase(null)">Close</button>'
        + '<div class="case-head">'
        +   C.portrait(m, 'case-portrait')
        +   '<div class="case-name' + (en ? '' : ' plain') + '">' + C.esc(m.name) + '</div>'
        +   (m.team ? '<div class="case-team">' + C.esc(m.team) + '</div>' : '')
        +   '<div class="case-standing">' + standing(m) + '</div>'
        +   '<p class="case-cite">' + C.esc(C.citation(m)) + '</p>'
        + '</div>'
        + shelves(m)
        + '<div class="case-plate">'
        +   '<div><div class="plate-k">Seasons</div><div class="plate-v">' + m.seasons_played + '</div></div>'
        +   '<div><div class="plate-k">Record</div><div class="plate-v">' + C.esc(m.record || '--') + '</div></div>'
        +   '<div><div class="plate-k">Titles</div><div class="plate-v">' + m.trophies.title + '</div></div>'
        +   '<div><div class="plate-k">Podiums</div><div class="plate-v">' + podiums(m) + '</div></div>'
        +   '<div style="text-align:right"><div class="plate-k">Index</div><div class="plate-index">' + C.fmt(m.index) + '</div></div>'
        + '</div>'
        + ledger(m)
        + '</div>'
        + '</article>';
}

function ledger(m) {
    var rows = m.ledger.slice().sort(function (a, b) { return b.year - a.year; }).map(function (s) {
        return '<div class="cl-row' + (s.final_rank === 1 ? ' title' : '') + '">'
            + '<div class="cl-yr">' + s.year + '</div>'
            + '<div class="cl-fin">' + C.ordinal(s.final_rank) + ' of ' + (s.teams || '--')
            +   (s.reg_crown ? ' &middot; best record' : '') + (s.points_title ? ' &middot; scoring title' : '') + '</div>'
            + '<div>' + C.esc(s.record || '--') + '</div>'
            + '<div>' + (s.all_play ? s.all_play.w + '-' + s.all_play.l : '--') + '</div>'
            + '<div class="cl-ppg">' + C.fmt(s.ppg) + '</div>'
            + '<div class="cl-q"><b style="width:' + Math.round(s.q * 100) + '%"></b></div>'
            + '</div>';
    }).join('');
    return '<div class="case-ledger">'
        + '<div class="cl-head"><span>Year</span><span>Finish</span><span>Record</span>'
        +   '<span>All-play</span><span>PPG</span><span>Season</span></div>'
        + rows + '</div>';
}

/* ============================================================
   The reckoning (ported).
   ============================================================ */
function contribs(m) {
    var mix = MODEL.weights.mix, c = m.parts.credibility;
    return {
        trophy: { raw: m.parts.trophy, w: mix.T, val: c * mix.T * m.parts.trophy },
        rate:   { raw: m.parts.rate,   w: mix.R, val: c * mix.R * m.parts.rate },
        peak:   { raw: m.parts.peak,   w: mix.P, val: c * mix.P * m.parts.peak },
    };
}

var RK_ROWS = [
    ['trophy', 'Trophy case'],
    ['rate',   'Season rate'],
    ['peak',   'Peak run'],
];

function reckoning() {
    var list = MODEL.managers;
    var a = list.filter(function (m) { return m.uid === cmpA; })[0] || list[0];
    var b = list.filter(function (m) { return m.uid === cmpB; })[0] || list[1] || list[0];
    cmpA = a.uid; cmpB = b.uid;

    var ca = contribs(a), cb = contribs(b);
    var scale = 0;
    RK_ROWS.forEach(function (r) { scale = Math.max(scale, ca[r[0]].val, cb[r[0]].val); });
    scale = scale || 1;

    var rows = RK_ROWS.map(function (r) {
        var k = r[0], va = ca[k], vb = cb[k];
        return '<div class="rk-row">'
            + '<div class="rk-v a' + (va.val > vb.val ? ' win' : '') + '">' + C.fmt(va.val) + '</div>'
            + '<div class="rk-bar a"><b style="width:' + (va.val / scale * 100) + '%"></b></div>'
            + '<div class="rk-lab">' + r[1] + '<i>' + Math.round(va.w * 100) + '% of the Index</i></div>'
            + '<div class="rk-bar b"><b style="width:' + (vb.val / scale * 100) + '%"></b></div>'
            + '<div class="rk-v b' + (vb.val > va.val ? ' win' : '') + '">' + C.fmt(vb.val) + '</div>'
            + '</div>';
    }).join('');

    var credRow = (a.parts.credibility < 1 || b.parts.credibility < 1)
        ? '<div class="rk-row"><div class="rk-v a">' + C.fmt(a.parts.credibility, 2) + '</div>'
          + '<div class="rk-bar a"><b style="width:' + (a.parts.credibility * 100) + '%"></b></div>'
          + '<div class="rk-lab">Credibility<i>ramps in short careers</i></div>'
          + '<div class="rk-bar b"><b style="width:' + (b.parts.credibility * 100) + '%"></b></div>'
          + '<div class="rk-v b">' + C.fmt(b.parts.credibility, 2) + '</div></div>'
        : '';

    return '<div class="reckon"><div class="reckon-in">'
        + '<div class="rk-head">'
        +   picker('cmpA', a.uid) + '<div class="rk-vs">against</div>' + picker('cmpB', b.uid)
        + '</div>'
        + '<div class="rk-tops">'
        +   '<div class="rk-top">' + C.portrait(a, 'case-portrait')
        +     '<div class="rk-name">' + C.esc(a.name) + '</div>'
        +     (a.team ? '<div class="rk-team">' + C.esc(a.team) + '</div>' : '')
        +     '<div class="rk-idx">' + C.fmt(a.index) + '<i>Index</i></div></div>'
        +   '<div class="rk-gap">The gap<b>' + C.fmt(Math.abs(a.index - b.index)) + '</b></div>'
        +   '<div class="rk-top">' + C.portrait(b, 'case-portrait')
        +     '<div class="rk-name">' + C.esc(b.name) + '</div>'
        +     (b.team ? '<div class="rk-team">' + C.esc(b.team) + '</div>' : '')
        +     '<div class="rk-idx">' + C.fmt(b.index) + '<i>Index</i></div></div>'
        + '</div>'
        + '<p class="rk-verdict">' + verdict(a, b, ca, cb) + '</p>'
        + '<div class="rk-rows">' + rows + credRow
        +   '<div class="rk-row total">'
        +     '<div class="rk-v a' + (a.index > b.index ? ' win' : '') + '">' + C.fmt(a.index) + '</div>'
        +     '<div class="rk-bar a"><b style="width:' + (a.index / Math.max(a.index, b.index, 1) * 100) + '%"></b></div>'
        +     '<div class="rk-lab">Index<i>the sum</i></div>'
        +     '<div class="rk-bar b"><b style="width:' + (b.index / Math.max(a.index, b.index, 1) * 100) + '%"></b></div>'
        +     '<div class="rk-v b' + (b.index > a.index ? ' win' : '') + '">' + C.fmt(b.index) + '</div>'
        +   '</div>'
        + '</div>'
        + facts(a, b)
        + years(a, b)
        + '</div></div>';
}

function picker(which, sel) {
    var cur = MODEL.managers.filter(function (m) { return m.uid === sel; })[0];
    return '<div class="rk-pick" id="pick-' + which + '">'
        + '<button type="button" class="rk-pick-btn" onclick="toggleMenu(\'' + which + '\')">'
        +   '<span>' + C.esc(cur.name) + ' &middot; ' + C.fmt(cur.index) + '</span><i>&#9662;</i></button>'
        + '<div class="rk-menu" hidden>'
        + MODEL.managers.map(function (m) {
              return '<button type="button" class="rk-opt' + (m.uid === sel ? ' on' : '') + '"'
                  + ' data-uid="' + C.esc(m.uid) + '"'
                  + ' onclick="setCmp(\'' + which + '\', this.getAttribute(\'data-uid\'))">'
                  + C.portrait(m, 'rk-opt-face')
                  + '<span class="rk-opt-name">' + C.esc(m.name) + '</span>'
                  + '<b>' + C.fmt(m.index) + '</b></button>';
          }).join('')
        + '</div></div>';
}

function toggleMenu(which) {
    var pick = document.getElementById('pick-' + which);
    var wasOpen = pick.classList.contains('open');
    closeMenus();
    if (!wasOpen) {
        pick.classList.add('open');
        pick.querySelector('.rk-menu').hidden = false;
    }
}

function closeMenus() {
    document.querySelectorAll('.rk-pick.open').forEach(function (p) {
        p.classList.remove('open');
        p.querySelector('.rk-menu').hidden = true;
    });
}

var RK_WHY = {
    trophy: 'what he has won',
    rate:   'how he plays in an average season',
    peak:   'how high his best stretch went',
};
function verdict(a, b, ca, cb) {
    if (a.uid === b.uid) return 'Pick two different managers.';
    var lead = a.index >= b.index ? a : b, trail = lead === a ? b : a;
    var lc = lead === a ? ca : cb, tc = lead === a ? cb : ca;
    var diffs = RK_ROWS.map(function (r) { return { k: r[0], d: lc[r[0]].val - tc[r[0]].val }; })
                       .sort(function (x, y) { return Math.abs(y.d) - Math.abs(x.d); });
    var top = diffs[0], back = diffs.filter(function (d) { return d.d < 0; });
    var s = '<b>' + C.esc(lead.name) + '</b> leads by ' + C.fmt(Math.abs(a.index - b.index))
          + ', and ' + (top.d >= 0 ? 'most of it is ' : 'oddly not ') + RK_WHY[top.k]
          + ' (' + (top.d >= 0 ? '+' : '') + C.fmt(top.d) + ').';
    if (back.length) {
        s += ' ' + C.esc(trail.name) + ' is actually ahead on '
           + back.map(function (d) { return RK_WHY[d.k]; }).join(' and ') + '.';
    }
    if (lead.parts.credibility < 1) {
        s += ' ' + C.esc(lead.name) + ' is still short of the ' + MODEL.constants.MIN_SEASONS
           + '-season bar, so his Index is held back to ' + Math.round(lead.parts.credibility * 100) + '%.';
    }
    return s;
}

function factRow(label, va, vb, better, o) {
    o = o || {};
    var na = parseFloat(va), nb = parseFloat(vb);
    var num = isFinite(na) && isFinite(nb);
    var aw = better && num && (better > 0 ? na > nb : na < nb);
    var bw = better && num && (better > 0 ? nb > na : nb < na);
    var av = '<div class="rk-fv a' + (aw ? ' win' : '') + '">' + va + '</div>';
    var bv = '<div class="rk-fv b' + (bw ? ' win' : '') + '">' + vb + '</div>';
    if (!o.scale || !num) {
        return '<div class="rk-frow wide nobar"><div></div>' + av
             + '<div class="rk-flab">' + label + '</div>' + bv + '<div></div></div>';
    }
    function bar(v, side) {
        return '<div class="rk-bar ' + side + '"><b style="width:'
             + Math.max(0, Math.min(100, v / o.scale * 100)) + '%"></b></div>';
    }
    return '<div class="rk-frow' + (o.wide ? ' wide' : '') + '">'
        + av + bar(na, 'a')
        + '<div class="rk-flab">' + label + '</div>'
        + bar(nb, 'b') + bv + '</div>';
}

function facts(a, b) {
    var ta = a.trophies, tb = b.trophies;
    var cabinet = Math.max(1, podiums(a), podiums(b),
        ta.title, tb.title, ta.runner_up, tb.runner_up, ta.third, tb.third,
        ta.moty, tb.moty, ta.reg_crown, tb.reg_crown, ta.points_title, tb.points_title);
    var yrs = Math.max(1, a.seasons_played, b.seasons_played);

    return '<div class="rk-facts">'
        + '<h4>The trophy case</h4>'
        + factRow('Titles', ta.title, tb.title, 1, { scale: cabinet })
        + factRow('Runner-up', ta.runner_up, tb.runner_up, 1, { scale: cabinet })
        + factRow('Third', ta.third, tb.third, 1, { scale: cabinet })
        + factRow('MOTY', ta.moty, tb.moty, 1, { scale: cabinet })
        + factRow('Best record', ta.reg_crown, tb.reg_crown, 1, { scale: cabinet })
        + factRow('Scoring', ta.points_title, tb.points_title, 1, { scale: cabinet })
        + factRow('Podiums', podiums(a), podiums(b), 1, { scale: cabinet })
        + '<h4>The career</h4>'
        + factRow('Seasons', a.seasons_played, b.seasons_played, 0, { scale: yrs })
        + factRow('Berths', ta.berth, tb.berth, 1, { scale: yrs })
        + factRow('Win %', C.pct(a.win_pct), C.pct(b.win_pct), 1, { scale: 1, wide: true })
        + factRow('Record', C.esc(a.record || '--'), C.esc(b.record || '--'), 0, { wide: true })
        + factRow('Playoffs', C.esc(a.playoff_record || '--'), C.esc(b.playoff_record || '--'), 0, { wide: true })
        + factRow('Avg finish', C.fmt(a.avg_finish), C.fmt(b.avg_finish), -1, { wide: true })
        + factRow('Standing', C.esc(a.status_label), C.esc(b.status_label), 0, { wide: true })
        + '</div>';
}

function years(a, b) {
    var byYear = {};
    a.ledger.forEach(function (s) { (byYear[s.year] = byYear[s.year] || {}).a = s; });
    b.ledger.forEach(function (s) { (byYear[s.year] = byYear[s.year] || {}).b = s; });
    var side = function (s, cls) {
        if (!s) return '<div class="rk-side ' + cls + '"><span class="rk-none">did not play</span></div>';
        return '<div class="rk-side ' + cls + '">'
            + (cls === 'b' ? '<div class="rk-q"><b style="width:' + Math.round(s.q * 100) + '%"></b></div>' : '')
            + '<span>' + C.ordinal(s.final_rank) + '</span><u>' + C.esc(s.record || '') + '</u>'
            + (cls === 'a' ? '<div class="rk-q"><b style="width:' + Math.round(s.q * 100) + '%"></b></div>' : '')
            + '</div>';
    };
    var rows = Object.keys(byYear).sort().map(function (y) {
        return '<div class="rk-yrow">' + side(byYear[y].a, 'a')
             + '<div class="rk-yr">' + y + '</div>' + side(byYear[y].b, 'b') + '</div>';
    }).join('');
    return '<div class="rk-years"><div class="rk-yhead"><div style="text-align:right">Finish &middot; record</div>'
        + '<div class="rk-yr">Year</div><div>Finish &middot; record</div></div>' + rows + '</div>';
}

function setCmp(which, uid) {
    if (which === 'cmpA') cmpA = uid; else cmpB = uid;
    document.getElementById('reckon').innerHTML = reckoning();
}

function compareFrom(uid) {
    if (cmpB === uid) cmpB = cmpA;
    cmpA = uid;
    openCase(null);
    document.getElementById('reckon').innerHTML = reckoning();
    setChap('cmp', true);
    document.getElementById('chap-cmp').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ══ Manager of the Year: the pennants ═══════════════════════ */
var CMP_ORDER = ['result', 'reg', 'draft', 'scoring', 'allplay', 'roster'];
var CMP_LABEL = { result: 'Finish', reg: 'Reg season', draft: 'Draft',
                  scoring: 'Scoring', allplay: 'All-play', roster: 'In-season' };
function cmpRank(k) { var i = CMP_ORDER.indexOf(k); return i < 0 ? 99 : i; }

function bannerCols() {
    var w = window.innerWidth;
    if (w >= 860) return 4;
    if (w >= 620) return 3;
    return 2;
}
function rackRows(n, cols) {
    var rows = Math.max(1, Math.ceil(n / cols));
    var base = Math.floor(n / rows), extra = n % rows, sizes = [];
    for (var i = 0; i < rows; i++) sizes.push(base + (i < extra ? 1 : 0));
    return sizes;
}
function racks() {
    var list = MODEL.moty, cols = bannerCols(), at = 0;
    return rackRows(list.length, cols).map(function (size) {
        var row = list.slice(at, at + size);
        at += size;
        return '<div class="banner-rack" style="--cols:' + cols + ';--n:' + size + '">'
             + '<div class="rod"></div>'
             + '<div class="banners">' + row.map(banner).join('') + '</div>'
             + '</div>';
    }).join('');
}

function banner(s) {
    var w = s.winner;
    var champ = s.champion === w.uid;
    return '<button type="button" class="banner' + (openYear === s.year ? ' open' : '') + '" onclick="toggleYear(' + s.year + ')">'
        + '<span class="bn">'
        + '<div class="bn-year">' + s.year
        +   (champ ? '<span class="cup">' + C.GLYPH.cup + '</span>' : '') + '</div>'
        + '<div class="bn-rule"></div>'
        + '<div class="bn-face">' + C.portrait(w, 'bn-portrait') + '</div>'
        + '<div class="bn-name">' + C.esc(w.name) + '</div>'
        + '<div class="bn-sub">' + C.esc(w.record || '') + ' &middot; ' + C.ordinal(w.final_rank) + '</div>'
        + '<div class="bn-champ">' + (champ ? 'Took the title too' : 'Title: <b>' + C.esc(championName(s)) + '</b>') + '</div>'
        + '<div class="bn-stack">' + stack(w, s.ballot[0].score) + '</div>'
        + '</span>'
        + '</button>';
}
function championName(s) {
    var c = s.ballot.filter(function (r) { return r.uid === s.champion; })[0];
    return c ? c.name : 'unknown';
}
function stack(r, top) {
    var total = r.parts.reduce(function (a, p) { return a + p.w * p.val; }, 0) || 1;
    var score = 100 * (r.score || 0) / (top || r.score || 1);
    return r.parts.slice()
        .sort(function (a, b) { return cmpRank(a.key) - cmpRank(b.key); })
        .map(function (p) { return { key: p.key, w: (p.w * p.val) / total * score }; })
        .filter(function (p) { return p.w > 0.5; })
        .map(function (p) { return '<span class="cmp-' + p.key + '" style="width:' + p.w + '%"></span>'; })
        .join('');
}

function toggleYear(y) {
    openYear = openYear === y ? null : y;
    document.querySelectorAll('.banner').forEach(function (el) { el.classList.remove('open'); });
    var host = document.getElementById('ballotOpen');
    if (openYear === null) { host.innerHTML = ''; return; }
    var s = MODEL.moty.filter(function (x) { return x.year === y; })[0];
    document.querySelectorAll('.banner')[MODEL.moty.indexOf(s)].classList.add('open');
    host.innerHTML = ballotPanel(s);
    host.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function ballotPanel(s) {
    var legend = s.components.slice().sort(function (a, b) { return cmpRank(a) - cmpRank(b); })
      .map(function (k) {
        return '<span><i class="cmp-' + k + '"></i>' + CMP_LABEL[k] + ' ' + Math.round(MODEL.weights.moty[k] * 100) + '%</span>';
    }).join('');
    var missing = CMP_ORDER.filter(function (k) { return s.components.indexOf(k) < 0; });
    var top = s.ballot[0] ? s.ballot[0].score : 0;
    var rows = s.ballot.map(function (r) {
        return '<div class="bo-row' + (r.rank === 1 ? ' win' : '') + '">'
            + '<div class="bo-rank">' + r.rank + '</div>'
            + '<div class="bo-name">' + C.esc(r.name) + '</div>'
            + '<div class="bo-fin">' + C.ordinal(r.final_rank) + '</div>'
            + '<div class="bo-stack">' + stack(r, top) + '</div>'
            + '<div class="bo-score">' + C.fmt(r.score) + '</div></div>';
    }).join('');
    return '<div class="scroll">'
        + '<div class="bo-head"><div class="bo-title">' + s.year + ' &middot; <b>' + C.esc(s.winner.name) + '</b></div>'
        +   '<div class="bo-legend">' + legend + '</div></div>' + rows
        + (missing.length ? '<div class="bo-missing">Not scored this season: '
            + missing.map(function (k) { return CMP_LABEL[k]; }).join(', ')
            + '. Weights renormalise over what the league has on file.</div>' : '')
        + '</div>';
}

function sheet() {
    var t = MODEL.weights.trophy, mix = MODEL.weights.mix, mw = MODEL.weights.moty;
    function line(k, v) { return '<div class="lc-line"><span>' + k + '</span><b>' + v + '</b></div>'; }
    return '<div class="sheet">'
        + '<h3>How the Index is built</h3>'
        + '<div class="lc-sub">Drawn from the league&rsquo;s own record. Nothing here is voted on.</div>'
        + '<div class="lc-cols">'
        +   '<div><h4>The trophy case</h4>'
        +     line('Championship', t.title) + line('Manager of the Year', t.moty)
        +     line('Runner-up', t.runner_up) + line('Best regular-season record', t.reg_crown)
        +     line('League scoring title', t.points_title) + line('Third place', t.third)
        +     line('Playoff berth', t.berth)
        +     '<h4 style="margin-top:1.4rem">The mix</h4>'
        +     line('Trophy case', Math.round(mix.T * 100) + '%') + line('Season-by-season rate', Math.round(mix.R * 100) + '%')
        +     line('Best three-year peak', Math.round(mix.P * 100) + '%') + '</div>'
        +   '<div><h4>Manager of the Year</h4>'
        +     line('Final standing', Math.round(mw.result * 100) + '%')
        +     line('Regular-season finish', Math.round(mw.reg * 100) + '%')
        +     line('All-play record', Math.round(mw.allplay * 100) + '%')
        +     line('Scoring power', Math.round(mw.scoring * 100) + '%')
        +     line('Draft class', Math.round(mw.draft * 100) + '%')
        +     line('In-season roster building', Math.round(mw.roster * 100) + '%')
        +     '<h4 style="margin-top:1.4rem">Enshrinement</h4>'
        +     line('Minimum seasons', MODEL.constants.MIN_SEASONS)
        +     line('Absolute floor', MODEL.constants.ABSOLUTE_FLOOR)
        +     line('Hall capped at', Math.round(MODEL.constants.HALL_SHARE * 100) + '% of eligible')
        +     line('Current bar', C.fmt(MODEL.bar)) + '</div>'
        + '</div>'
        + '<p class="lc-note"><b>A banner is a standing, not a ceremony.</b> '
        + 'The bar floats against the field and the hall is capped, so a banner <i>can</i> come down when someone '
        + 'hangs a better case, and go back up when the career grows again. Nobody is voted in on a date and '
        + 'nobody is in for life. The rafters say where a career stands the moment you look up.</p>'
        + '<p class="lc-note">Every season term is normalised inside its own season, so one scoring era never competes with '
        + 'another. The bar floats against the field you actually play in, which is how a three-year league and a twenty-year '
        + 'league both run this page honestly. Alumni keep their standing: leaving does not close a case.</p>'
        + '</div>';
}
</script>
</body>
</html>
