<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Weekly · {{LEAGUE_NAME}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/pams-template/assets/css/mobile-app.css">
<link rel="stylesheet" href="/pams-template/assets/css/weekly.css">
</head>
<body>
<div class="wk-glow"></div>

<nav id="site-nav" data-page="weekly" data-chapter="Ch. VII · The Weekly" data-back-href="live/"></nav>
<script src="/pams-template/assets/js/mobile-app.js"></script>

<main class="m-main">

    <!-- ── Masthead. The week number is the headline; everything under it
         is dated so a screenshot in the group chat still says when. ── -->
    <header class="wk-head">
        <div class="wk-head-sup" id="wkSup">★ {{LEAGUE_ABBR}} ★</div>
        <h1 class="wk-title">The <em>Weekly.</em></h1>
        <p class="wk-strap">Everything worth checking before Sunday, on one page.</p>
        <div class="wk-rule"></div>
        <div class="wk-dateline">
            <span id="wkDateLeft">Loading</span>
            <span id="wkDateRight" class="dateline-right"></span>
        </div>
    </header>

    <!-- ── Identity. Same profile roster and same stored key as pick'ems,
         so claiming a name on either page carries to the other. ── -->
    <div class="wk-id" id="wkId">
        <span class="wk-id-lbl">Reading as</span>
        <select id="wkSelect" class="wk-select" aria-label="Pick your name">
            <option value="">— pick your name —</option>
        </select>
        <span class="wk-whoami-name" id="wkWhoamiName" hidden></span>
        <button type="button" class="wk-btn" id="wkChange" hidden>Change</button>
        <button type="button" class="wk-btn is-signal" id="wkShare" aria-label="Share this week">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 9.5 9.5 6.5"/><path d="M7 4.5h-1.5a3 3 0 0 0 0 6h1.5"/><path d="M9 11.5h1.5a3 3 0 0 0 0-6h-1.5"/></svg>
            Share
        </button>
    </div>

    <div id="wkBody">
        <section class="wk-sec" id="secYou">
            <div class="wk-panel"><div class="wk-skel"></div></div>
        </section>
        <section class="wk-sec" id="secBoard"></section>
        <section class="wk-sec" id="secPower"></section>
        <section class="wk-sec" id="secWire"></section>
        <section class="wk-sec" id="secRecords"></section>
    </div>

    <div class="wk-foot">{{LEAGUE_ABBR}} · The Weekly · {{LEAGUE_FOUNDED}}</div>

</main>

<output id="wkToast" class="wk-toast" aria-live="polite">Link copied</output>

<script src="/pams-template/assets/js/weekly.js"></script>
</body>
</html>
