<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seasons · {{LEAGUE_NAME}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/pams-template/assets/css/mobile-app.css">
<style>
.se-head { text-align: center; padding: 1.1rem 0 1rem; }
.se-title {
    font-family: var(--serif);
    font-size: 1.7rem; line-height: 1.05;
    color: var(--cream);
}
.se-title em { font-style: italic; color: var(--gold); }

/* Featured (latest complete) season */
.se-feature {
    position: relative;
    background: linear-gradient(150deg, var(--ink-card), var(--ink-soft));
    overflow: hidden;
    margin-bottom: .9rem;
}
.se-feature::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
/* Two columns. The card used to be a single left-set stack, which left the
   right half of a 390px card as empty gradient — so the seal moved in there
   and took the year with it. Nothing is repeated between the columns: the
   year is IN the seal now, not set twice. */
.se-feature-row {
    display: flex; align-items: center; gap: .8rem;
}
.se-feature-body { min-width: 0; flex: 1; }
.se-feature-champ {
    font-family: var(--serif);
    font-size: 1.08rem; line-height: 1.15;
    color: var(--cream);
    margin-top: .3rem;
}
.se-feature-champ em { font-style: italic; color: var(--gold); }

/* ── Champion's seal ──
   A struck seal, not a badge: double ring, the title's ordinal curved along
   the top of the outer ring, the year struck in the middle, and the
   champion's OTHER title years listed under it. First-timers get the year
   alone and the ring says so, which is the whole point of the ordinal being
   there — you can read "how many" and "which ones" off one mark. */
.se-seal { flex: none; display: block; }
.se-seal-ring {
    font-family: var(--mono); font-weight: 700;
    font-size: 7.2px; letter-spacing: 1.2px;
    fill: var(--gold-deep);
    text-transform: uppercase;
}
.se-seal-year {
    font-family: var(--serif);
    font-size: 25px;
    fill: var(--gold);
}
.se-seal-prior {
    font-family: var(--mono); font-weight: 700;
    font-size: 7px; letter-spacing: .6px;
    fill: var(--cream-mute);
}

/* Timeline rows */
.se-year {
    flex: none;
    font-family: var(--serif); font-size: 1.15rem;
    color: var(--gold);
    width: 3.2rem;
}
.se-row-name {
    min-width: 0; flex: 1;
    font-weight: 600; font-size: .92rem;
}
.se-row-name small {
    display: block;
    font-weight: 400; font-size: .7rem;
    color: var(--cream-mute);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.se-row-rec {
    flex: none;
    font-family: var(--mono); font-weight: 700;
    font-size: .72rem; color: var(--cream-soft);
}
/* Heavier season separators — the year rows read as one block otherwise. */
.m-list .se-row { border-bottom: 1px solid #36465c; }
.m-list .se-row:last-child { border-bottom: none; }
.m-chevron { flex: none; color: var(--cream-mute); }
.se-row-partial small i { font-style: normal; color: var(--gold-deep); }
</style>
</head>
<body>
<div class="site-glow"></div>

<nav id="site-nav" data-page="seasons" data-chapter="Ch. IV · Season Archives" data-back-href="./"></nav>
<script src="/pams-template/assets/js/mobile-app.js"></script>

<main class="m-main">
    <header class="se-head">
        <div class="m-kicker">League History</div>
        <h1 class="se-title">Season <em>Archives.</em></h1>
    </header>

    <div id="feature"></div>
    <div class="m-list" id="rows"><div class="m-empty">Opening the archives…</div></div>
</main>

<script>
(function () {
    'use strict';

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    var ORDINALS = ['', 'First', 'Second', 'Third', 'Fourth', 'Fifth', 'Sixth', 'Seventh', 'Eighth', 'Ninth', 'Tenth'];
    function ordinalTitle(n) {
        if (n >= 1 && n < ORDINALS.length) return ORDINALS[n] + ' Title';
        var v = n % 100;
        var suffix = (v >= 11 && v <= 13) ? 'th' : ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th');
        return n + suffix + ' Title';
    }

    /**
     * The champion's seal, struck for the featured season.
     *
     * Matched on champion_user_id rather than on the display name: names are
     * editable and two managers in a long league can share one, where the id
     * is what every other join on this site uses.
     *
     * Three things on it, and none of them repeat the card beside it:
     *   · the outer ring says WHICH title this is ("Third Title")
     *   · the middle is struck with the year
     *   · under it, the years they won before, oldest first
     * A first title gets a clean centre and a ring that says First Title,
     * which is the same information without a list of nothing.
     */
    function sealHTML(featured, seasons) {
        var uid = featured.champion_user_id;
        var prior = [];
        if (uid) {
            for (var i = 0; i < seasons.length; i++) {
                var s = seasons[i];
                if (s !== featured && s.champion_user_id === uid) prior.push(s.year);
            }
        }
        prior.sort(function (a, b) { return a - b; });
        var count = prior.length + 1;

        // Three years is what fits across the inner field at 7px mono. Past
        // that the oldest are dropped to a leading ellipsis, so the list
        // always ends on the most recent one before this.
        var shown = prior.length > 3 ? prior.slice(prior.length - 3) : prior;
        var priorText = shown.join(' · ') + (prior.length > shown.length ? ' …' : '');

        return '<svg class="se-seal" viewBox="0 0 100 100" width="92" height="92" aria-hidden>' +
            '<defs><path id="seSealArc" d="M 50 50 m -38 0 a 38 38 0 0 1 76 0" fill="none"/></defs>' +
            '<circle cx="50" cy="50" r="47" fill="none" stroke="var(--gold-deep)" stroke-width="1"/>' +
            '<circle cx="50" cy="50" r="43.5" fill="none" stroke="var(--gold-deep)" stroke-width=".6" opacity=".55"/>' +
            '<circle cx="50" cy="50" r="31" fill="none" stroke="var(--gold-deep)" stroke-width=".6" opacity=".4"/>' +
            '<text class="se-seal-ring"><textPath href="#seSealArc" startOffset="50%" text-anchor="middle">' +
                esc(ordinalTitle(count)) +
            '</textPath></text>' +
            '<text class="se-seal-year" x="50" y="' + (prior.length ? 52 : 57) + '" text-anchor="middle">' +
                featured.year +
            '</text>' +
            (prior.length
                ? '<text class="se-seal-prior" x="50" y="67" text-anchor="middle">' + esc(priorText) + '</text>'
                : '') +
            // The two flanking marks sit where the ring text stops, closing
            // the arc the way a struck seal's would.
            '<path d="M 15.5 56 l 2.6 2.6 l -2.6 2.6 l -2.6 -2.6 z" fill="var(--gold-deep)" opacity=".8"/>' +
            '<path d="M 84.5 56 l 2.6 2.6 l -2.6 2.6 l -2.6 -2.6 z" fill="var(--gold-deep)" opacity=".8"/>' +
        '</svg>';
    }

    fetch('data/seasons_directory.json')
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; })
        .then(function (dir) {
            var seasons = (dir && dir.seasons) || [];
            var box = document.getElementById('rows');
            if (!seasons.length) {
                box.innerHTML = '<div class="m-empty">No completed seasons yet, the first chapter is still being written.</div>';
                return;
            }
            // Newest first; the newest complete season gets the feature card.
            seasons.sort(function (a, b) { return b.year - a.year; });
            var featured = null;
            for (var i = 0; i < seasons.length; i++) {
                if (seasons[i].has_complete_data) { featured = seasons[i]; break; }
            }
            if (featured) {
                document.getElementById('feature').innerHTML =
                    '<a class="m-card se-feature" href="seasons/season?year=' + featured.year + '">' +
                        '<div class="se-feature-row">' +
                            '<div class="se-feature-body">' +
                                '<div class="m-kicker">Latest Chronicle</div>' +
                                '<div class="se-feature-champ"><em>' + esc(featured.champion_name) + '</em> takes the crown</div>' +
                                '<div class="m-mono" style="margin-top:.35rem">' +
                                    esc(featured.champion_team_name || '') +
                                    (featured.champion_record ? ' · ' + esc(featured.champion_record) : '') +
                                    ' · ' + featured.total_teams + ' teams' +
                                '</div>' +
                            '</div>' +
                            sealHTML(featured, seasons) +
                        '</div>' +
                    '</a>';
            }
            var rest = seasons.filter(function (s) { return s !== featured; });
            if (!rest.length) {
                box.remove();
                return;
            }
            box.innerHTML = rest.map(function (s) {
                var partial = !s.has_complete_data;
                var sub = partial
                    ? '<i>Partial records</i>'
                    : esc(s.champion_team_name || '') + ' · champion';
                return '<a class="m-list-row se-row' + (partial ? ' se-row-partial' : '') + '" href="seasons/season?year=' + s.year + '">' +
                    '<span class="se-year">' + s.year + '</span>' +
                    '<span class="se-row-name">' + esc(s.champion_name || '·') + '<small>' + sub + '</small></span>' +
                    '<span class="se-row-rec">' + esc(s.champion_record || '') + '</span>' +
                    '<svg class="m-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 5 16 12 9 19"/></svg>' +
                '</a>';
            }).join('');
        });
})();
</script>
</body>
</html>
